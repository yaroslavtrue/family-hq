<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Moya</title>
<!-- PWA -->
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#7c6aef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Moya">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/icons/favicon-16.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#fef5ec;--sf:#fff8f0;--cd:#ffffff;--bd:rgba(0,0,0,0.09);--tx:#2a1d12;--ht:#80705f;--pr:#f2631c;--pg:rgba(242,99,28,0.12);--ac:#fb3b4e;--ok:#3fa36a;--wn:#f5a623;--gd:linear-gradient(135deg,#e9550f,#ff8a3d);--gtx:#fff;--r:20px;--r-sm:14px;--r-pill:999px;--nh:64px;--shadow-1:0 2px 12px rgba(0,0,0,.18);--shadow-2:0 8px 24px rgba(0,0,0,.22)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',-apple-system,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;overflow-x:hidden;padding-bottom:calc(120px + env(safe-area-inset-bottom, 0px));-webkit-font-smoothing:antialiased}

/* Header — gradient icon square + title + subtitle */
.hd{padding:14px 20px 12px;padding-top:max(14px, calc(env(safe-area-inset-top, 0px) + 6px));background:color-mix(in srgb,var(--sf) 88%,transparent);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;gap:10px;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.hd-l{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.hd-ico{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 38%,transparent),color-mix(in srgb,var(--pr) 10%,transparent));border:1px solid color-mix(in srgb,var(--pr) 45%,transparent);color:var(--pr);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--pr) 20%,transparent),0 2px 10px color-mix(in srgb,var(--pr) 18%,transparent)}
.hd-tx{min-width:0;flex:1}
.hd h1{font-size:20px;font-weight:700;letter-spacing:-.3px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-s{font-size:11px;color:var(--ht);margin-top:2px;font-weight:500;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hd-r{display:flex;gap:2px;align-items:center;flex-shrink:0}
.hd-g{background:none;border:none;color:var(--ht);cursor:pointer;padding:6px;display:flex}.hd-g svg{width:22px;height:22px}

/* Search bar */
.sb{overflow:hidden;max-height:0;transition:max-height .25s ease,padding .25s ease;background:var(--sf);padding:0 20px;border-bottom:1px solid transparent}
.sb.open{max-height:56px;padding:0 20px 12px;border-bottom-color:var(--bd)}
.sb input{width:100%;padding:10px 16px;border-radius:12px;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);font-size:14px;outline:none;font-family:inherit}
.sb input:focus{border-color:var(--pr)}.sb input::placeholder{color:var(--ht)}

/* Pull to refresh */
.ptr{text-align:center;height:0;overflow:hidden;transition:height .2s;color:var(--ht);font-size:12px;display:flex;align-items:center;justify-content:center;font-weight:600}
.ptr.show{height:40px}
.ptr .spin{display:inline-block;animation:sp .6s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* Nav */
.nv{display:flex;position:fixed;bottom:0;left:0;right:0;background:color-mix(in srgb,var(--sf) 85%,transparent);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--bd);height:calc(var(--nh) + env(safe-area-inset-bottom, 0px));padding-bottom:env(safe-area-inset-bottom, 0px);z-index:20;align-items:center;padding-left:4px;padding-right:4px}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 4px;background:none;border:none;color:var(--ht);font-size:9px;font-weight:500;cursor:pointer;transition:all .25s ease;position:relative;font-family:inherit;border-radius:12px}
.ni.a{color:var(--pr);font-weight:700}.ni svg{width:20px;height:20px;transition:transform .2s ease}
.ni.a svg{transform:scale(1.1)}
.nb{position:absolute;top:3px;right:calc(50% - 22px);min-width:18px;height:18px;border-radius:9px;background:var(--ac);color:#fff;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;box-shadow:0 0 0 2px var(--sf),0 2px 6px color-mix(in srgb,var(--ac) 35%,transparent);letter-spacing:.2px;z-index:2;pointer-events:none}

/* Content */
.ct{padding:14px 16px 24px}

/* Section headers — uppercase micro-label with counter pill */
.sc{font-size:11px;font-weight:700;color:var(--ht);text-transform:uppercase;letter-spacing:1.2px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sc .at{text-transform:none;letter-spacing:0;font-size:12px;color:var(--pr);background:none;border:none;cursor:pointer;font-weight:600;font-family:inherit}
.sc-cnt{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 6px;border-radius:9px;background:color-mix(in srgb,var(--ht) 18%,transparent);color:var(--ht);font-size:10px;font-weight:700;letter-spacing:0;margin-left:6px}
.sc-l{display:inline-flex;align-items:center;gap:6px}
.sc-ico{display:inline-flex;align-items:center;line-height:1;opacity:.95}
/* Sub-group divider inside a section (Upcoming 7 days → Tasks / Events / Subs / Birthdays).
   Color tinted via --gc custom property per group. */
.sc-sub{display:flex;align-items:center;gap:10px;margin:14px 0 8px;font-size:11px;font-weight:700;letter-spacing:.4px}
.sc-sub-l{color:var(--gc,var(--ht));flex-shrink:0}
.sc-sub-line{flex:1;height:1px;background:color-mix(in srgb,var(--gc,var(--bd)) 28%,transparent)}
.sc-sub-c{flex-shrink:0;font-size:10px;font-weight:700;color:var(--gc,var(--ht));background:color-mix(in srgb,var(--gc,var(--ht)) 14%,transparent);padding:2px 9px;border-radius:9px}

/* Cards */
.c{background:var(--cd);border-radius:var(--r);padding:16px 18px;margin-bottom:12px;border:1px solid var(--bd);display:flex;align-items:center;gap:13px;transition:all .25s;animation:ci .3s ease-out;box-shadow:var(--shadow-1)}
.c.d{opacity:.35}

/* Premium list card — gradient icon + title + meta + trailing pill (subs/events/birthdays/upcoming) */
.lc{background:var(--cd);border-radius:var(--r);padding:14px 16px;margin-bottom:10px;border:1px solid var(--bd);display:flex;align-items:center;gap:14px;transition:transform .15s,box-shadow .25s;animation:ci .3s ease-out;box-shadow:var(--shadow-1)}
.lc:active{transform:scale(.985)}
/* Icon container — transparent accent gradient + soft border; emoji/SVG sits on a "frosted tint" instead of a heavy solid fill */
.lc-i{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 38%,transparent),color-mix(in srgb,var(--pr) 10%,transparent));border:1px solid color-mix(in srgb,var(--pr) 45%,transparent);color:var(--pr);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--pr) 18%,transparent),0 2px 10px color-mix(in srgb,var(--pr) 14%,transparent)}
.lc-i.acc-ac{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 38%,transparent),color-mix(in srgb,var(--ac) 10%,transparent));border-color:color-mix(in srgb,var(--ac) 45%,transparent);color:var(--ac);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--ac) 18%,transparent),0 2px 10px color-mix(in srgb,var(--ac) 14%,transparent)}
.lc-i.acc-ok{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 38%,transparent),color-mix(in srgb,var(--ok) 10%,transparent));border-color:color-mix(in srgb,var(--ok) 45%,transparent);color:var(--ok);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--ok) 18%,transparent),0 2px 10px color-mix(in srgb,var(--ok) 14%,transparent)}
.lc-i.acc-wn{background:linear-gradient(135deg,color-mix(in srgb,var(--wn) 38%,transparent),color-mix(in srgb,var(--wn) 10%,transparent));border-color:color-mix(in srgb,var(--wn) 45%,transparent);color:var(--wn);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--wn) 18%,transparent),0 2px 10px color-mix(in srgb,var(--wn) 14%,transparent)}
.lc-i.acc-pr{background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 38%,transparent),color-mix(in srgb,var(--pr) 10%,transparent));border-color:color-mix(in srgb,var(--pr) 45%,transparent);color:var(--pr);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--pr) 18%,transparent),0 2px 10px color-mix(in srgb,var(--pr) 14%,transparent)}
/* Settings row variant — slightly tighter, chevron at the end */
.lc-row{padding:12px 14px}
.lc-tap{cursor:pointer;transition:background .15s,transform .12s}
.lc-tap:active{transform:scale(.985);background:color-mix(in srgb,var(--tx) 4%,var(--cd))}
.lc-chev{flex-shrink:0;color:var(--ht);font-size:20px;font-weight:300;line-height:1;margin-left:2px;opacity:.7}
/* Member row in Settings */
.lc-mem{padding:12px 14px}
.lc-mem .lc-bd{gap:6px}
.lc-mem-strip{width:32px;height:4px;border-radius:2px;margin-top:2px}
/* Family invite code card */
.invite-card{background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 14%,var(--cd)),var(--cd));border:1.5px dashed color-mix(in srgb,var(--pr) 50%,transparent);border-radius:18px;padding:16px;text-align:center;margin:4px 0 22px;box-shadow:var(--shadow-1)}
.invite-lb{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ht);margin-bottom:8px}
.invite-cd{font-size:30px;font-weight:800;letter-spacing:6px;color:var(--pr);font-variant-numeric:tabular-nums}
.invite-hint{font-size:11px;color:var(--ht);margin-top:6px;font-weight:500}
.lc-bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.lc-tt{font-size:15px;font-weight:600;color:var(--tx);line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lc-mt{font-size:12px;color:var(--ht);font-weight:500;line-height:1.3}
.lc-rt{display:inline-flex;align-items:center;padding:5px 11px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--ht) 14%,transparent);color:var(--ht);font-size:11px;font-weight:600;letter-spacing:.2px;flex-shrink:0;white-space:nowrap}
.lc-rt.tone-ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.lc-rt.tone-ac{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac)}
.lc-rt.tone-wn{background:color-mix(in srgb,var(--wn) 18%,transparent);color:var(--wn)}

/* Meta pills (date / priority / reminders) on task cards */
.pdate{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:var(--r-pill);background:color-mix(in srgb,var(--wn) 14%,transparent);color:var(--wn);font-size:11px;font-weight:600;letter-spacing:.1px}
.pdate.tone-ac{background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac)}
.pdate.tone-ok{background:color-mix(in srgb,var(--ok) 14%,transparent);color:var(--ok)}
.ppri{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r-pill);font-size:11px;font-weight:700;letter-spacing:.2px}
.ppri.lo{background:color-mix(in srgb,var(--pri-lo) 14%,transparent);color:var(--pri-lo)}
.ppri.md{background:color-mix(in srgb,var(--pri-md) 16%,transparent);color:var(--pri-md)}
.ppri.hi{background:color-mix(in srgb,var(--pri-hi) 18%,transparent);color:var(--pri-hi)}
@keyframes ci{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* Checkboxes */
.cb{width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .25s}
.cb-o{border:1.5px solid var(--ht)}.cb-k{background:var(--ok);border:none}.cb-k svg{stroke:#fff}
.cb-s{width:20px;height:20px;border-radius:6px}

/* Card content */
.bd{flex:1;min-width:0}
.tt{font-size:15px;font-weight:500;line-height:1.3}
.tt.sk{text-decoration:line-through;color:var(--ht)}
.c-stk{border:1.5px solid var(--ok)}
.mt{font-size:12px;color:var(--ht);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}

/* Badges & chips */
.bg{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600}
.ch{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;border:2px solid transparent;transition:all .15s}
.ch.s{border-color:currentColor}.ch-s{padding:2px 7px;font-size:10px}

/* Buttons */
.bi{background:none;border:none;color:var(--ht);cursor:pointer;padding:5px;border-radius:8px;display:flex;transition:color .2s}.bi svg{width:15px;height:15px}
.btn{width:100%;padding:14px;border-radius:14px;background:var(--gd);color:var(--gtx,#fff);border:none;font-size:15px;font-weight:600;cursor:pointer;margin-top:4px;font-family:inherit;box-shadow:0 4px 16px color-mix(in srgb,var(--pr) 30%,transparent);transition:transform .15s,box-shadow .15s}
.btn:active{transform:scale(.98);box-shadow:0 2px 8px color-mix(in srgb,var(--pr) 25%,transparent)}
.btn-s{background:var(--cd);color:var(--tx);border:1.5px solid var(--bd);box-shadow:none}

/* Stats grid */
.sts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.sts-3{grid-template-columns:1fr 1fr 1fr;gap:8px}
.st{background:var(--cd);border-radius:18px;padding:14px 12px;border:1px solid var(--bd);cursor:pointer;transition:transform .15s;box-shadow:var(--shadow-1)}
.st:active{transform:scale(.97)}
.sn{font-size:26px;font-weight:800;line-height:1}
.sl{font-size:12px;color:var(--ht);margin-top:5px;font-weight:500}
/* Money stats tile — icon + uppercase label + big number */
.st-mn{text-align:left;padding:13px 12px}
.st-mn .st-ico{width:30px;height:30px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:8px;border:1px solid transparent;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.st-mn .st-ico.tone-ok{background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 38%,transparent),color-mix(in srgb,var(--ok) 8%,transparent));border-color:color-mix(in srgb,var(--ok) 42%,transparent);color:var(--ok)}
.st-mn .st-ico.tone-ac{background:linear-gradient(135deg,color-mix(in srgb,var(--ac) 38%,transparent),color-mix(in srgb,var(--ac) 8%,transparent));border-color:color-mix(in srgb,var(--ac) 42%,transparent);color:var(--ac)}
.st-mn .st-ico.tone-pr{background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 38%,transparent),color-mix(in srgb,var(--pr) 8%,transparent));border-color:color-mix(in srgb,var(--pr) 42%,transparent);color:var(--pr)}
.st-mn .st-lb{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--ht);font-weight:700}
.st-mn .st-vl{font-size:16px;font-weight:800;letter-spacing:-.3px;margin-top:3px;line-height:1.15}
.st-mn .st-vl.pos{color:var(--ok)}
.st-mn .st-vl.neg{color:var(--ac)}
/* Polished chart bars (Last 6 Months) */
/* Legacy 6-month static chart — kept for compat. New scrollable .chart-wrap below. */
.chart-bars{display:flex;gap:6px;align-items:flex-end;height:108px;padding:8px 4px 0;margin-bottom:10px;background:var(--cd);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--shadow-1)}
.chart-bars .cbar{flex:1;text-align:center;display:flex;flex-direction:column;align-items:center}
.chart-bars .cbar-pair{display:flex;gap:3px;align-items:flex-end;justify-content:center;height:74px}
.chart-bars .cbar-b{width:9px;border-radius:3px 3px 0 0;min-height:3px;background:linear-gradient(180deg,var(--c1),var(--c2))}
.chart-bars .cbar-b.b-in{--c1:color-mix(in srgb,var(--ok),white 18%);--c2:var(--ok)}
.chart-bars .cbar-b.b-ex{--c1:color-mix(in srgb,var(--ac),white 18%);--c2:var(--ac)}
.chart-bars .cbar-lb{font-size:9px;color:var(--ht);margin-top:6px;font-weight:600;letter-spacing:.2px}
.chart-legend{display:flex;gap:14px;font-size:11px;color:var(--ht);margin-bottom:16px;padding:0 4px}
.chart-legend .dotk{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* Scrollable monthly chart (v8.30.2) — 24 bars, tap to navigate, year watermarks */
.chart-wrap{position:relative;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;scroll-snap-type:x proximity;background:var(--cd);border:1px solid var(--bd);border-radius:18px;box-shadow:var(--shadow-1);padding:10px 0;margin-bottom:10px}
.chart-wrap::-webkit-scrollbar{display:none}
.chart-strip{display:flex;gap:10px;padding:0 14px;align-items:flex-end;min-width:fit-content;height:108px;position:relative}
.chart-yr-wm{position:absolute;top:0;bottom:24px;display:flex;align-items:center;justify-content:center;color:var(--tx);font-size:72px;font-weight:900;letter-spacing:-3px;opacity:.08;pointer-events:none;z-index:0;line-height:1;overflow:hidden;white-space:nowrap;font-family:ui-monospace,SF Mono,Menlo,monospace}
.chart-wrap .cbar{position:relative;z-index:1;flex-shrink:0;width:32px;text-align:center;display:flex;flex-direction:column;align-items:center;cursor:pointer;scroll-snap-align:center;transition:transform .12s;padding:6px 0 0;border-radius:8px}
.chart-wrap .cbar:active{transform:scale(.94)}
.chart-wrap .cbar-pair{display:flex;gap:4px;align-items:flex-end;justify-content:center;height:74px}
.chart-wrap .cbar-b{width:10px;border-radius:3px 3px 0 0;min-height:3px;background:linear-gradient(180deg,var(--c1),var(--c2));transition:box-shadow .2s,transform .2s}
.chart-wrap .cbar-b.b-in{--c1:color-mix(in srgb,var(--ok),white 18%);--c2:var(--ok)}
.chart-wrap .cbar-b.b-ex{--c1:color-mix(in srgb,var(--ac),white 18%);--c2:var(--ac)}
.chart-wrap .cbar-lb{font-size:10px;color:var(--ht);margin-top:6px;font-weight:600;letter-spacing:.3px;text-transform:lowercase}
/* Soft fade-swap for Analytics containers (tiles / header / extras) — retriggered
   on month change via _anaFadeSwap so values feel smooth instead of snapping. */
@keyframes ana-soft-swap{from{opacity:.45;transform:translateY(3px)}to{opacity:1;transform:none}}
.ana-soft{animation:ana-soft-swap .28s cubic-bezier(.2,.9,.3,1.05) both}

@keyframes cbar-sel-pop{0%{transform:scaleY(.94);opacity:.6}60%{transform:scaleY(1.06);opacity:1}100%{transform:scaleY(1.04);opacity:1}}
.chart-wrap .cbar-sel{background:color-mix(in srgb,var(--pr) 12%,transparent);animation:cbar-sel-pop .35s cubic-bezier(.2,.9,.3,1.1) both}
.chart-wrap .cbar-sel .cbar-b{transform:scaleY(1.04);box-shadow:0 0 12px color-mix(in srgb,currentColor 30%,transparent);transition:transform .25s cubic-bezier(.2,.9,.3,1.1),box-shadow .25s ease-out}
.chart-wrap .cbar-sel .b-in{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ok) 50%,transparent)}
.chart-wrap .cbar-sel .b-ex{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ac) 50%,transparent)}
.chart-wrap .cbar-sel .cbar-lb{color:var(--pr);font-weight:800;transition:color .2s,font-weight .2s}
/* Category / Limit rows polished */
.cat-row{margin-bottom:10px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow-1)}
.cat-row-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;margin-bottom:6px}
.cat-row-h .nm{font-weight:600;display:inline-flex;align-items:center;gap:6px}
.cat-row-h .nm .em{font-size:16px}
.cat-row-h .vl{font-weight:800;letter-spacing:-.2px;font-size:13px}
.cat-row .progress{height:6px;background:color-mix(in srgb,var(--bd) 60%,transparent);border-radius:3px;overflow:hidden}
.cat-row .progress-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,color-mix(in srgb,var(--pr),white 18%),var(--pr));transition:width .5s ease}
.cat-row .progress-fill.tone-ok{background:linear-gradient(90deg,color-mix(in srgb,var(--ok),white 18%),var(--ok))}
.cat-row .progress-fill.tone-ac{background:linear-gradient(90deg,color-mix(in srgb,var(--ac),white 18%),var(--ac))}

/* FAB */
.fab{position:fixed;bottom:calc(var(--nh) + env(safe-area-inset-bottom, 0px) + 18px);right:18px;width:52px;height:52px;border-radius:16px;background:var(--gd);color:var(--gtx,#fff);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 6px 24px color-mix(in srgb,var(--pr) 35%,transparent);z-index:15;transition:transform .2s,box-shadow .2s}
.fab:active{transform:scale(.88);box-shadow:0 3px 12px color-mix(in srgb,var(--pr) 25%,transparent)}.fab svg{width:22px;height:22px}

/* Modal */
.mo{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);display:flex;align-items:flex-end;justify-content:center;z-index:80;opacity:0;transition:opacity .25s;pointer-events:none}
.mo.op{opacity:1;pointer-events:auto}
.mx{background:var(--sf);border-radius:28px 28px 0 0;padding:24px 24px 38px;width:100%;max-width:480px;transform:translateY(100%);transition:transform .35s cubic-bezier(.2,.9,.3,1);max-height:88vh;overflow-y:auto;box-shadow:0 -12px 48px rgba(0,0,0,.38);padding-bottom:max(38px,calc(env(safe-area-inset-bottom,0px) + 24px))}
.mx::before{content:'';display:block;width:44px;height:5px;border-radius:3px;background:color-mix(in srgb,var(--ht) 40%,transparent);margin:0 auto 18px}
.mo.op .mx{transform:translateY(0)}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px}
.mt2{font-size:20px;font-weight:800;letter-spacing:-.3px;display:inline-flex;align-items:center;gap:10px;line-height:1.15}
.mt2-ico{width:34px;height:34px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 38%,transparent),color-mix(in srgb,var(--pr) 10%,transparent));border:1px solid color-mix(in srgb,var(--pr) 45%,transparent);color:var(--pr)}

/* Form elements */
.inp{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);font-size:15px;outline:none;margin-bottom:12px;box-sizing:border-box;font-family:inherit;transition:border-color .2s,box-shadow .2s,background .2s}
.inp:focus{border-color:var(--pr);background:var(--sf);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 20%,transparent)}.inp::placeholder{color:var(--ht)}
input[type="date"],input[type="time"],input[type="number"],select{-webkit-appearance:none;appearance:none;width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(--bd);background:var(--cd);color:var(--tx);font-size:15px;font-family:inherit;outline:none;box-sizing:border-box;color-scheme:dark;transition:border-color .2s,box-shadow .2s,background .2s}
input[type="date"]:focus,input[type="time"]:focus,input[type="number"]:focus,select:focus{border-color:var(--pr);background:var(--sf);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 20%,transparent)}
.ls input[type="date"],.ls input[type="time"],.ls select{color-scheme:light}
.dr{display:flex;gap:10px;margin-bottom:12px}.dr>div{flex:1}
.dl{font-size:11px;color:var(--ht);margin-bottom:6px;font-weight:700;text-transform:uppercase;letter-spacing:.6px}
.lb{font-size:11px;font-weight:700;color:var(--ht);margin-bottom:8px;text-transform:uppercase;letter-spacing:.9px}
.or{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.ob{padding:7px 14px;border-radius:999px;font-size:13px;font-weight:600;cursor:pointer;background:transparent;color:var(--ht);border:1.5px solid var(--bd);font-family:inherit;transition:all .15s}
.ob.s{color:var(--pr);background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 24%,transparent),color-mix(in srgb,var(--pr) 8%,transparent));border-color:color-mix(in srgb,var(--pr) 55%,transparent);box-shadow:0 2px 8px color-mix(in srgb,var(--pr) 16%,transparent)}

/* Tabs */
.tabs{display:flex;gap:0;margin-bottom:16px;background:var(--cd);border-radius:14px;padding:3px;border:1px solid var(--bd)}
.tab{flex:1;padding:10px;text-align:center;font-size:12px;font-weight:600;cursor:pointer;border-radius:11px;transition:all .25s;color:var(--ht);font-family:inherit;border:1px solid transparent;background:none}
.tab.a{background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 30%,transparent),color-mix(in srgb,var(--pr) 10%,transparent));color:var(--pr);border-color:color-mix(in srgb,var(--pr) 50%,transparent);box-shadow:0 2px 10px color-mix(in srgb,var(--pr) 20%,transparent),inset 0 1px 0 color-mix(in srgb,var(--pr) 16%,transparent)}

/* Filter bar */
.fb2{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;align-items:center}
.fi{display:inline-flex;align-items:center;gap:4px;padding:4px 12px;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;background:transparent;color:var(--ht);border:1.5px solid transparent;font-family:inherit}
.fi.a{background:color-mix(in srgb,var(--pr),transparent 85%);color:var(--pr);border-color:color-mix(in srgb,var(--pr),transparent 60%)}

/* Subtasks */
.sbs{margin-top:8px;padding-left:36px}
.si{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--bd)}.si:first-child{border-top:none}
.sx{font-size:13px;flex:1}.sx.dn{text-decoration:line-through;color:var(--ht)}
.sa{display:flex;gap:6px;margin-top:6px;padding-left:36px}
.sa input{flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-size:13px;outline:none;font-family:inherit}
.sa button{padding:8px 12px;border-radius:10px;background:var(--gd);color:#fff;border:none;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}
.xb{background:none;border:none;color:var(--ht);font-size:11px;cursor:pointer;padding:2px 0;font-family:inherit;font-weight:500}

/* Priority */
.pr{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600}

/* Cleaning zones */
.zn{background:var(--cd);border-radius:var(--r);padding:14px 16px;margin-bottom:12px;border:1px solid var(--bd);animation:ci .3s ease-out;box-shadow:var(--shadow-1)}
.zh{display:flex;align-items:center;gap:13px}
.zh .lc-i{width:48px;height:48px;font-size:24px}
.zn-bd{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.zn-nm{font-size:15px;font-weight:700;color:var(--tx);line-height:1.2}
.zn-mt{font-size:12px;color:var(--ht);font-weight:500}
.zn-chev{flex-shrink:0;transition:transform .2s}
.zn-tasks{margin-top:12px;padding-top:10px;border-top:1px solid var(--bd)}
.zn-del{margin-top:10px;background:none;border:none;color:var(--ac);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;padding:4px 0;opacity:.75;transition:opacity .15s}
.zn-del:active{opacity:1}
/* Legacy classes kept for backward compat (some places still reference) */
.zi{font-size:28px}.zn2{font-size:16px;font-weight:700;flex:1}
.zs{padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.zs.ok{background:color-mix(in srgb,var(--ok),transparent 85%);color:var(--ok)}
.zs.no{background:color-mix(in srgb,var(--ac),transparent 85%);color:var(--ac)}
.zm{font-size:12px;color:var(--ht);margin-bottom:10px}
.zt{display:flex;align-items:center;gap:10px;padding:8px 0}.zt:not(:last-child){border-bottom:1px solid var(--bd)}
.zt-t{font-size:14px;flex:1}.zt-t.dn{text-decoration:line-through;color:var(--ht)}
.zt-mt{font-size:10px;color:var(--ht);white-space:nowrap}
.za{display:flex;gap:6px;margin-top:10px}
.za input{flex:1;padding:8px 12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font-size:13px;outline:none;font-family:inherit}
.za button{padding:8px 14px;border-radius:10px;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 30%,transparent),color-mix(in srgb,var(--pr) 10%,transparent));border:1px solid color-mix(in srgb,var(--pr) 50%,transparent);color:var(--pr);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit}

/* Profile hero block (selected member) */
.prof-hero{display:flex;align-items:center;gap:14px;padding:16px;margin-bottom:18px;background:var(--cd);border:1px solid var(--bd);border-radius:20px;box-shadow:var(--shadow-1);position:relative;overflow:hidden}
.prof-hero img,.prof-hero .av{width:64px!important;height:64px!important;border-radius:50%;box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 25%,transparent)}
.prof-hero-bd{flex:1;min-width:0}
.prof-hero-nm{font-size:20px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.prof-hero-sub{font-size:12px;color:var(--ht);margin-top:2px;font-weight:500}
.prof-hero-strip{width:36px;height:4px;border-radius:2px;margin-top:8px}

/* Weather forecast overlay (full-screen modal, similar to .cal-mo) */
.wx-mo{position:fixed;inset:0;background:var(--bg);z-index:62;display:none;flex-direction:column}
.wx-mo.open{display:flex;animation:fadeIn .2s ease-out}
.wx-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:max(10px, calc(env(safe-area-inset-top, 0px) + 4px));border-bottom:1px solid var(--bd);gap:8px}
.wx-iconbtn{background:none;border:none;color:var(--tx);cursor:pointer;padding:6px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,transform .25s}
.wx-iconbtn:active{background:var(--cd)}
.wx-iconbtn.spinning svg{animation:spin .8s linear infinite}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.wx-city{flex:1;background:none;border:none;color:var(--tx);font-size:16px;font-weight:700;letter-spacing:-.2px;cursor:pointer;font-family:inherit;padding:8px 12px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background .15s}
.wx-city:active{background:var(--cd)}
.wx-body{flex:1;overflow-y:auto;padding:16px 14px 24px;overscroll-behavior:contain}
/* Today hero block (left-top, big text). Combined with .wbg.wbg-{cat} → gets video background + animated weather layers, so no own bg here. */
.wx-hero{display:flex;align-items:flex-start;gap:14px;padding:18px 16px;border-radius:22px;margin-bottom:16px;box-shadow:0 8px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06);overflow:hidden;position:relative}
.wx-hero-ico{flex-shrink:0;display:flex;align-items:center;justify-content:center;width:80px;height:80px}
.wx-hero-tx{flex:1;min-width:0}
.wx-hero-lb{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ht);margin-bottom:4px}
.wx-hero-temp{font-size:48px;font-weight:800;line-height:1;letter-spacing:-1.5px;color:var(--tx)}
.wx-hero-sub{font-size:13px;color:var(--ht);margin-top:4px;font-weight:600}
.wx-hero-range{font-size:12px;color:var(--ht);margin-top:8px;font-weight:600;display:inline-flex;gap:10px}
.wx-hero-range .hi{color:var(--tx)}
/* 14-day grid: 7 columns × 2 rows */
.wx-grid-lb{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--ht);margin:6px 0 8px;padding-left:4px}
.wx-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:10px;box-shadow:var(--shadow-1)}
.wx-day{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px;border-radius:12px;transition:background .15s}
.wx-day:active{background:color-mix(in srgb,var(--tx) 5%,transparent)}
.wx-day.wx-today{background:color-mix(in srgb,var(--pr) 14%,transparent);border:1px solid color-mix(in srgb,var(--pr) 35%,transparent);padding:7px 3px}
.wx-dow{font-size:9px;font-weight:700;color:var(--ht);text-transform:uppercase;letter-spacing:.4px}
.wx-day.wx-today .wx-dow{color:var(--pr)}
.wx-dom{font-size:14px;font-weight:800;color:var(--tx);letter-spacing:-.3px}
.wx-day.wx-today .wx-dom{color:var(--pr)}
.wx-ico{margin:1px 0;display:flex;align-items:center;justify-content:center;height:28px}
.wx-max{font-size:11px;font-weight:700;color:var(--tx);letter-spacing:-.2px}
.wx-min{font-size:10px;color:var(--ht);font-weight:600}
/* Wraps each week as its own row for visual separation */
.wx-week{margin-bottom:10px}
.wx-week+.wx-week{margin-bottom:0}

/* City search results */
.wx-cs-row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;cursor:pointer;background:var(--cd);border:1px solid var(--bd);margin-bottom:6px;transition:transform .12s,background .15s}
.wx-cs-row:active{transform:scale(.985);background:color-mix(in srgb,var(--pr) 10%,var(--cd))}
.wx-cs-pin{width:36px;height:36px;border-radius:11px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 38%,transparent),color-mix(in srgb,var(--pr) 10%,transparent));border:1px solid color-mix(in srgb,var(--pr) 45%,transparent);color:var(--pr)}
.wx-cs-bd{flex:1;min-width:0}
.wx-cs-nm{font-size:14px;font-weight:600;color:var(--tx);line-height:1.2}
.wx-cs-mt{font-size:11px;color:var(--ht);font-weight:500;margin-top:1px}

/* Words / Vocabulary mode — full-screen takeover. Standard .hd is hidden via body.words-mode */
body.words-mode .hd{display:none}
body.words-mode .ct{padding-top:max(10px, calc(env(safe-area-inset-top, 0px) + 6px))}

/* ─── Life — balance network (v8.51.0; header restored v8.51.1) ── */
/* Keeps the familiar global header. The graph lives in a dark "night sky"
   panel below a slim Me/partner/Family filter row. */
body.life-mode .ct{padding:0;background:#0a0b10}
/* Life is a fixed full-screen canvas — never let the PAGE scroll, or the absolute
   .life-top (back/month bar, z:3) slides up under the sticky header (.hd, z:10).
   The Journey/Challenges overlays scroll internally, so this doesn't affect them. */
body.life-mode{overflow:hidden}
.life-wrap{position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
/* Life is always a dark "space" stage, so give its chrome (chips, journey/challenge buttons,
   challenge cards…) dark surfaces regardless of the app theme — otherwise var(--cd) is white
   on the Moya light theme and the emoji buttons get a white box. The header stays themed (it's
   outside .life-wrap). */
.life-wrap{--bg:#0a0b10;--sf:#11131c;--cd:#171a26;--bd:rgba(255,255,255,0.12);--tx:#edeae0;--ht:#9a9aae;--pg:rgba(255,255,255,0.06)}
/* Filter row floats OVER the canvas (top-right) — no separate black strip.
   pointer-events pass through the empty bar to the canvas; only chips catch taps. */
.life-top{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:10px;padding:10px 14px;z-index:3;pointer-events:none}
.life-top > *{pointer-events:auto}
#life-top-main{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.life-areaname{font-size:15px;font-weight:700;color:#EDEAE0;text-shadow:0 1px 4px rgba(0,0,0,.6)}
.life-chips{display:flex;align-items:center;gap:6px}
.life-chip{display:inline-flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:50%;background:var(--cd);border:1.5px solid var(--bd);cursor:pointer;padding:0;transition:transform .12s,border-color .15s;font-size:16px;overflow:hidden}
.life-chip .av,.life-chip .av-em{border-radius:50%}
.life-chip.on{border-color:color-mix(in srgb,var(--pr) 70%,transparent);box-shadow:0 0 0 2px color-mix(in srgb,var(--pr) 22%,transparent)}
.life-chip:active{transform:scale(.92)}
.life-chip-fam{font-size:17px}
.life-chip-fam.on{border-color:#E06A8A;box-shadow:0 0 0 2px rgba(224,106,138,.25)}
.life-back{width:34px;height:34px;border-radius:12px;background:var(--cd);border:1px solid var(--bd);color:var(--tx);font-size:24px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.life-back:active{transform:scale(.92)}
/* Month switcher (calendar-style, on the night-sky top bar) */
.life-mnav{display:inline-flex;align-items:center;gap:4px;background:rgba(20,20,34,.55);border:1px solid rgba(255,255,255,.12);border-radius:13px;padding:2px}
.life-mnav-b{width:26px;height:26px;border:none;background:none;color:#EDEAE0;font-size:17px;line-height:1;cursor:pointer;border-radius:9px;display:flex;align-items:center;justify-content:center}
.life-mnav-b:active{background:rgba(255,255,255,.1)}
.life-mnav-b.off{opacity:.28;pointer-events:none}
.life-mnav-l{font-size:12px;font-weight:700;color:#EDEAE0;min-width:96px;text-align:center;text-transform:capitalize;letter-spacing:.2px}
/* Event detail counter (− value +) */
.life-count{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0 2px}
.life-count-b{width:40px;height:40px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-size:22px;font-weight:700;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center}
.life-count-b:active{transform:scale(.9)}
.life-count-v{font-size:38px;font-weight:800;line-height:1;min-width:48px;text-align:center;letter-spacing:-1px}
/* AI suggestions modal */
.life-thinking{text-align:center;color:var(--ht);padding:30px 12px;font-size:14px;animation:lifePulse 1.4s ease-in-out infinite}
@keyframes lifePulse{0%,100%{opacity:.5}50%{opacity:1}}
.life-sugg-sub{font-size:12px;color:var(--ht);margin-bottom:10px}
.life-sugg-list{display:flex;flex-direction:column;gap:8px}
.life-sugg{display:flex;align-items:center;gap:11px;padding:10px 11px;background:var(--cd);border:1px solid var(--bd);border-radius:14px}
.life-sugg-em{width:40px;height:40px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.life-sugg-bd{flex:1;min-width:0}
.life-sugg-n{font-size:14px;font-weight:700;color:var(--tx)}
.life-sugg-w{font-size:11.5px;color:var(--ht);margin-top:2px;line-height:1.35}
.life-sugg-add{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:none;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.life-sugg-add:active{transform:scale(.9)}
.life-sugg-ok{flex-shrink:0;width:34px;height:34px;display:flex;align-items:center;justify-content:center}
/* Sphere colour picker (new-sphere modal) */
.life-colors{display:flex;flex-wrap:wrap;gap:10px;margin-top:4px}
.life-color{width:34px;height:34px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;transition:transform .12s}
.life-color:active{transform:scale(.9)}
.life-color.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px #fff}
/* Full-bleed night-sky canvas — no frame, edge to edge, fills to the nav. */
/* Disable text selection + the iOS long-press callout so holding a node (emoji
   labels are SVG <text>) enters edit mode instead of selecting the glyph. */
.life-stage{position:relative;touch-action:none;overflow:hidden;background:radial-gradient(120% 80% at 50% 38%, #14151e 0%, #0c0d12 60%, #0a0b10 100%);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.life-stage text{user-select:none;-webkit-user-select:none}
#life-cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.life-hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:12px;color:rgba(237,234,224,.42);padding:0 24px;line-height:1.4;pointer-events:none;z-index:3}
.life-journey-btn{width:34px;height:34px;border-radius:50%;background:var(--cd);border:1.5px solid var(--bd);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.life-journey-btn:active{transform:scale(.92)}
/* Journey stats panel — scrollable overlay on the night-sky stage */
/* padding-top clears the absolute filter row (.life-top) that floats over the stage */
.life-journey{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:58px 16px max(28px,env(safe-area-inset-bottom,0px));z-index:2;color:#EDEAE0}
.life-jload{text-align:center;color:rgba(237,234,224,.45);padding:60px 0;font-size:24px;animation:lifePulse 1.4s ease-in-out infinite}
.life-jhero{text-align:center;padding:8px 0 18px}
.life-jbal{font-size:54px;font-weight:800;letter-spacing:-1px;line-height:1}
.life-jlabel{font-size:13px;color:rgba(237,234,224,.6);font-weight:600;margin-top:4px}
.life-jsec{font-size:11px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:rgba(237,234,224,.5);margin:18px 2px 8px}
.life-jspark-wrap{height:60px;background:rgba(255,255,255,.03);border-radius:14px;padding:8px;border:1px solid rgba(255,255,255,.06);overflow:hidden;margin-bottom:8px;box-sizing:border-box}
.life-spark{width:100%;height:100%;display:block}
.life-jstats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.life-jstat{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:14px;padding:14px}
.life-jstat-v{font-size:24px;font-weight:800;line-height:1}

/* Challenges (Phase 3) */
.life-chtabs{display:flex;gap:6px;margin-bottom:12px;background:rgba(255,255,255,.05);padding:4px;border-radius:12px}

.life-chbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:11px;border-radius:13px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);color:#EDEAE0;font-size:13px;font-weight:700;cursor:pointer}
.life-chbtn:active{transform:scale(.97)}
.life-chbtn-ai{background:color-mix(in srgb,var(--pr) 24%,transparent);border-color:color-mix(in srgb,var(--pr) 45%,transparent);color:#fff}
.life-chcard{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:13px;margin-bottom:10px}
.life-chcard-top{display:flex;align-items:center;gap:11px}
.life-chcard-em{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.06);display:flex;align-items:center;justify-content:center;font-size:21px;flex-shrink:0}
.life-chcard-bd{flex:1;min-width:0}
.life-chcard-t{font-size:14px;font-weight:700;color:#EDEAE0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.life-chcard-s{font-size:11.5px;color:rgba(237,234,224,.55);margin-top:1px}
.life-chcard-x{flex-shrink:0;width:30px;height:30px;border-radius:8px;background:transparent;border:none;color:rgba(237,234,224,.5);cursor:pointer;display:flex;align-items:center;justify-content:center}
.life-chcard-x:active{transform:scale(.9);color:#C77D7D}
.life-chprog{display:flex;align-items:center;gap:10px;margin-top:11px}
.life-chprog-track{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden}

.life-chprog-r{flex-shrink:0;font-size:13px;color:rgba(237,234,224,.7)}

.life-chstate{font-size:11px;font-weight:700;color:rgba(237,234,224,.5)}
/* Participant chips in the create-challenge modal — flex so avatar+name align */
.life-pchip{display:inline-flex;align-items:center;gap:6px;padding-left:7px;line-height:1}
.life-pchip .av,.life-pchip .av-em{width:20px;height:20px;border-radius:50%;flex-shrink:0}
.life-chparts{display:flex;flex-direction:column;gap:8px;margin-top:11px}
.life-chpart{display:flex;align-items:center;gap:9px}
.life-chpart .av,.life-chpart .av-em{width:22px;height:22px;border-radius:50%;flex-shrink:0}
/* Manual scoreboard rows (+/-) */
.life-score{display:flex;flex-direction:column;gap:9px;margin-top:12px}
.life-score-row{display:flex;align-items:center;gap:10px}
.life-score-row .av,.life-score-row .av-em{width:26px;height:26px;border-radius:50%;flex-shrink:0}
.life-score-name{flex:1;min-width:0;font-size:13px;font-weight:600;color:#EDEAE0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.life-score-b{width:30px;height:30px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#EDEAE0;font-size:18px;font-weight:700;line-height:1;cursor:pointer;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.life-score-b:active{transform:scale(.9)}
.life-score-v{min-width:30px;text-align:center;font-size:22px;font-weight:800;flex-shrink:0}
/* Life challenge widget on Home/Profile (themed — football-scoreboard feel) */
.lcw{border-radius:18px;padding:14px;margin-bottom:10px;border:1px solid var(--bd);box-shadow:var(--shadow-1);animation:ci .3s ease-out}
.lcw-title{font-size:14px;font-weight:700;color:var(--tx);display:flex;align-items:center;gap:6px;margin-bottom:12px}
.lcw-days{margin-left:auto;font-size:11px;font-weight:600;color:var(--ht)}
.lcw-board{display:flex;align-items:flex-start;gap:8px}
.lcw-side{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.lcw-side .av,.lcw-side .av-em{width:34px;height:34px;border-radius:50%}
.lcw-name{font-size:12px;font-weight:600;color:var(--tx);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcw-num{font-size:36px;font-weight:800;line-height:1;letter-spacing:-1px}
.lcw-vs{font-size:24px;font-weight:800;color:var(--ht);opacity:.45;align-self:center;padding-top:18px}
.lcw-ctrl{display:flex;gap:6px;margin-top:4px}
.lcw-b{width:30px;height:30px;border-radius:9px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.lcw-b:active{transform:scale(.9)}
.lcw-mini{display:flex;align-items:center;gap:11px;background:var(--cd)}
.lcw-mini-em{width:38px;height:38px;border-radius:11px;background:color-mix(in srgb,var(--pr) 10%,transparent);display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.lcw-mini-bd{flex:1;min-width:0}
.lcw-mini-t{font-size:13px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lcw-mini-bar{height:6px;border-radius:3px;background:color-mix(in srgb,var(--tx) 10%,transparent);margin-top:6px;overflow:hidden}
.lcw-mini-bar>div{height:100%;border-radius:3px}
.lcw-mini-r{font-size:13px;font-weight:700;color:var(--tx);flex-shrink:0}
/* Love Points — dedicated monthly couple scoreboard (Profile) */
.love-card{border-radius:20px;padding:16px 14px 10px;margin-bottom:14px;border:1px solid var(--bd);box-shadow:var(--shadow-1);animation:ci .3s ease-out}
.love-head{text-align:center;font-size:16px;font-weight:800;color:var(--tx);letter-spacing:.2px}
.love-days{text-align:center;font-size:11px;font-weight:600;color:var(--ht);margin-top:2px}
.love-board{display:flex;align-items:flex-start;gap:8px;margin-top:12px}
.love-side{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.love-side .av,.love-side .av-em{width:38px;height:38px;border-radius:50%}
.love-name{font-size:12px;font-weight:600;color:var(--tx);max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.love-num{font-size:42px;font-weight:800;line-height:1;letter-spacing:-1.5px}
.love-vs{font-size:26px;font-weight:800;color:var(--ht);opacity:.4;align-self:center;padding-top:22px}
.love-ctrl{display:flex;gap:7px;margin-top:5px}
.love-b{width:32px;height:32px;border-radius:10px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-size:19px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1}
.love-b:active{transform:scale(.9)}
.love-plus{border-width:1.5px}
.love-stats{display:block;width:100%;margin-top:12px;padding:9px 0 4px;border:0;border-top:1px solid color-mix(in srgb,var(--tx) 9%,transparent);background:none;color:var(--ht);font-size:11px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;opacity:.55}
.love-stats:active{opacity:1}
.love-aw-t{font-size:14px;font-weight:700;color:var(--tx);margin-bottom:10px;text-align:center}
.love-emos{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.love-emo{width:42px;height:42px;border-radius:12px;border:1px solid var(--bd);background:var(--cd);font-size:21px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.love-emo.s{border-color:var(--pr);border-width:2px;background:color-mix(in srgb,var(--pr) 12%,transparent)}
.love-emo:active{transform:scale(.92)}
.love-log{display:flex;flex-direction:column;gap:10px}
.love-log-empty{text-align:center;color:var(--ht);font-size:13px;padding:20px 0}
.love-log-row{display:flex;align-items:center;gap:11px}
.love-log-row .av,.love-log-row .av-em{width:30px;height:30px;border-radius:50%;flex-shrink:0}
.love-log-bd{flex:1;min-width:0}
.love-log-r{font-size:14px;font-weight:600;color:var(--tx)}
.love-log-m{font-size:11px;color:var(--ht);margin-top:1px}
.love-log-d{font-size:15px;font-weight:800;flex-shrink:0;color:var(--ok)}
.love-log-neg .love-log-d{color:var(--bad,#e5484d)}
.love-aw-neg{color:var(--bad,#e5484d)}
.love-btn-neg{background:var(--bad,#e5484d)!important}
/* Love history — monthly bars (me=blue / partner=pink) */
.lh-chart{display:flex;justify-content:space-between;gap:4px;align-items:flex-end;padding:10px 2px 0}
.lh-mcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;padding:6px 2px 4px;border-radius:12px;transition:background .2s}
.lh-mcol.a{background:color-mix(in srgb,var(--tx) 7%,transparent)}
.lh-bars{display:flex;align-items:flex-end;justify-content:center;gap:4px;height:80px}
.lh-barw{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px}
.lh-bval{font-size:11px;font-weight:800;line-height:1;min-height:11px}
.lh-bar{width:13px;min-height:3px;border-radius:5px 5px 2px 2px;transition:height .3s ease-out}
.lh-mlbl{font-size:10px;font-weight:700;color:var(--ht);text-transform:uppercase;letter-spacing:.4px}
.lh-mcol.a .lh-mlbl{color:var(--tx)}
.lh-tot{display:flex;justify-content:center;gap:28px;margin:14px 0 16px}
.lh-tot-c{display:flex;flex-direction:column;align-items:center;gap:3px}
.lh-tot-c .av,.lh-tot-c .av-em{width:32px;height:32px;border-radius:50%}
.lh-tot-n{font-size:26px;font-weight:800;line-height:1}
.lh-tot-l{font-size:11px;font-weight:600;color:var(--ht)}

/* SVG node bits (units = viewBox 0..100) */
.life-edge{stroke:#9b96a8;pointer-events:none}
.life-node{cursor:pointer}
/* The float sim translates these groups every frame — promote each to its own GPU
   layer so a move re-composites the cached glow instead of re-rasterising the
   radial gradient (the main cost of the continuous motion). */
.life-node,.life-av{will-change:transform}
/* Glow halos don't catch taps → the soft empty space between cores is reliable
   "background" for the long-press edit-mode gesture; cores stay tappable. */
.life-glow{pointer-events:none}
.life-breathe{animation:lifeBreathe 4.6s ease-in-out infinite}
@keyframes lifeBreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
/* Single focal element (family heart) — a slow gentle pulse, cheap (one node). */
.life-breathe-slow{animation:lifeBreathe 6s ease-in-out infinite}
.life-core,.life-glow{transform-box:fill-box;transform-origin:center}
.life-emoji{font-size:4.6px;text-anchor:middle;dominant-baseline:central}
.life-add-plus{font-size:6px;font-weight:700;fill:#EDEAE0;text-anchor:middle;dominant-baseline:central;opacity:.7}
.life-cap{font-size:3.1px;font-weight:700;fill:#EDEAE0;text-anchor:middle;dominant-baseline:central;opacity:.9}
.life-cap-hub{font-size:3.4px;opacity:.95}
.life-sub{font-size:2.5px;fill:#EDEAE0;text-anchor:middle;dominant-baseline:central;opacity:.5}
.life-badge{font-size:2.7px;font-weight:800;fill:#0c0c18;text-anchor:middle;dominant-baseline:central}
.life-ripple{animation:lifeRipple .7s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes lifeRipple{0%{transform:scale(1);stroke-opacity:.9}100%{transform:scale(3.2);stroke-opacity:0}}
/* iOS-style edit wiggle (transform-box:view-box → transform-origin is in viewBox units) */
.life-wiggle{transform-box:view-box;animation:lifeWiggle .32s ease-in-out infinite}
@keyframes lifeWiggle{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
/* Idle wiggle — gentle + slow, clearly softer than edit mode. */
.life-idle{transform-box:view-box;animation:lifeIdle 4.6s ease-in-out infinite}
@keyframes lifeIdle{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
/* Add/Ideas seeds grow out of the hub centre when edit mode opens. */
.life-grow{transform-box:view-box;animation:lifeGrow .5s cubic-bezier(.2,.85,.3,1.25) both}
@keyframes lifeGrow{0%{transform:scale(0);opacity:0}60%{opacity:1}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion: reduce){.life-breathe,.life-wiggle,.life-idle,.life-grow{animation:none}}

/* Life detail / forms */
.life-d{display:flex;flex-direction:column;align-items:center;text-align:center}
.life-d-emoji{width:64px;height:64px;border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:10px}
.life-d-name{font-size:20px;font-weight:800;color:var(--tx)}
.life-d-type{font-size:12px;color:var(--ht);margin-top:2px;text-transform:capitalize}
.life-d-stats{display:flex;gap:30px;margin:16px 0}
.life-d-stat{display:flex;flex-direction:column;gap:2px}
.life-d-v{font-size:26px;font-weight:800;color:var(--tx);line-height:1}
.life-d-l{font-size:11px;color:var(--ht)}
.wd-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:4px 0 16px;border-bottom:1px solid var(--bd);margin-bottom:18px}
.wd-iconbtn{background:none;border:none;color:var(--tx);cursor:pointer;padding:8px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;transition:background .15s,transform .12s}
.wd-iconbtn:active{background:var(--cd);transform:scale(.94)}
.wd-counter{flex:1;background:none;border:none;cursor:pointer;font-family:inherit;padding:6px 12px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:1px;transition:background .15s}
.wd-counter:active{background:var(--cd)}
.wd-counter-n{font-size:22px;font-weight:800;color:var(--pr);letter-spacing:-.4px;line-height:1}
.wd-counter-lb{font-size:10px;color:var(--ht);font-weight:600;letter-spacing:.3px;text-transform:uppercase}
.wd-progress{font-size:11px;color:var(--ht);font-weight:700;letter-spacing:1.2px;text-transform:uppercase;text-align:center;margin-bottom:14px}
.wd-card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:22px 20px 18px;box-shadow:var(--shadow-1);position:relative;animation:ci .3s ease-out;touch-action:pan-y}
.wd-visual{width:120px;height:120px;border-radius:24px;display:flex;align-items:center;justify-content:center;margin:0 auto 18px;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 38%,transparent),color-mix(in srgb,var(--pr) 10%,transparent));border:1px solid color-mix(in srgb,var(--pr) 45%,transparent);color:var(--pr);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--pr) 20%,transparent),0 4px 18px color-mix(in srgb,var(--pr) 18%,transparent);position:relative;overflow:hidden}
.wd-emoji{font-size:64px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.18))}
.wd-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit;opacity:0;transition:opacity .35s ease}
.wd-img.loaded{opacity:1}
.wd-src-row{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:4px}
.wd-src-word{font-size:26px;font-weight:800;letter-spacing:-.4px;color:var(--tx);line-height:1.15;text-align:center}
.wd-speak{background:color-mix(in srgb,var(--pr) 14%,transparent);border:1px solid color-mix(in srgb,var(--pr) 35%,transparent);color:var(--pr);cursor:pointer;width:34px;height:34px;border-radius:11px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .12s,background .15s}
.wd-speak:active{transform:scale(.92);background:color-mix(in srgb,var(--pr) 22%,transparent)}
.wd-src-ipa{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--ht);font-weight:600;text-align:center;letter-spacing:.2px}
.wd-divider{height:1px;background:var(--bd);margin:18px -4px}
.wd-def-lb{font-size:10px;font-weight:700;color:var(--ht);letter-spacing:.8px;text-transform:uppercase;margin-bottom:6px;text-align:center}
.wd-def{font-size:15px;font-weight:500;color:var(--tx);line-height:1.4;text-align:center;padding:0 6px}
.wd-input{width:100%;padding:14px 16px;border-radius:14px;border:2px solid var(--bd);background:var(--bg);color:var(--tx);font-size:17px;font-weight:600;text-align:center;outline:none;font-family:inherit;transition:border-color .2s,background .2s,box-shadow .2s;letter-spacing:.2px}
.wd-input:focus{border-color:var(--pr);background:var(--sf);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 18%,transparent)}
.wd-input.wd-correct{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--bg));color:var(--ok)}
.wd-input.wd-wrong{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 12%,var(--bg));color:var(--ac)}
@keyframes wdShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.wd-shake{animation:wdShake .35s ease-in-out}
.wd-hint{margin-top:10px;text-align:center;font-size:13px;font-weight:700;color:var(--ac);background:color-mix(in srgb,var(--ac) 14%,transparent);border:1px solid color-mix(in srgb,var(--ac) 35%,transparent);padding:8px 12px;border-radius:11px}
.wd-actions{display:flex;gap:8px;margin-top:16px}
.wd-btn-skip{flex:1}
.wd-btn-submit{flex:1.5}
.wd-done{text-align:center;padding:60px 20px}
.wd-done-emoji{font-size:64px;margin-bottom:14px}
.wd-done-t{font-size:22px;font-weight:800;letter-spacing:-.3px;margin-bottom:6px}
.wd-done-s{font-size:14px;color:var(--ht);font-weight:500}
/* Prompt (before answer) */
.wd-prompt{font-size:14px;font-weight:600;color:var(--ht);text-align:center;letter-spacing:.2px;margin-top:-2px}
/* Reveal block (after answer) */
.wd-reveal{border-radius:16px;padding:14px;text-align:center}
.wd-reveal-ok{background:color-mix(in srgb,var(--ok) 12%,transparent);border:1px solid color-mix(in srgb,var(--ok) 38%,transparent)}
.wd-reveal-wrong{background:color-mix(in srgb,var(--ac) 12%,transparent);border:1px solid color-mix(in srgb,var(--ac) 38%,transparent)}
.wd-reveal .wd-src-word{color:var(--tx);font-size:24px}
.wd-reveal .wd-src-ipa{color:var(--ht);font-size:13px}
