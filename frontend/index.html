.wd-reveal-wrong .wd-reveal-lb{color:var(--ac)}
.wd-your-ans{margin-top:8px;font-size:12px;color:var(--ht)}
.wd-your-ans span{color:var(--ac);font-weight:700}
.wd-def-sub{color:var(--ht);font-size:14px}
.wd-next-btn{margin-top:18px;width:100%}
.wd-example{font-size:14px;font-style:italic;color:var(--tx);line-height:1.45;padding:10px 14px;background:color-mix(in srgb,var(--tx) 4%,transparent);border-left:3px solid color-mix(in srgb,var(--pr) 45%,transparent);border-radius:0 12px 12px 0}
/* Example header row with translate toggle */
.wd-ex-hd{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:14px;margin-bottom:6px}
.wd-ex-lb{font-size:10px;font-weight:700;color:var(--ht);letter-spacing:.8px;text-transform:uppercase}
.wd-tr-btn{background:transparent;border:1px solid var(--bd);color:var(--ht);cursor:pointer;width:24px;height:24px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;padding:0;transition:transform .12s,background .15s,color .15s,border-color .15s}
.wd-tr-btn:active{transform:scale(.88)}
.wd-tr-btn.wd-tr-active{background:color-mix(in srgb,var(--pr) 16%,transparent);border-color:color-mix(in srgb,var(--pr) 42%,transparent);color:var(--pr)}
/* Reveal: source word + IPA shown below target */
.wd-rev-divider{height:1px;background:color-mix(in srgb,var(--bd) 80%,transparent);margin:10px 18% 8px;opacity:.7}
.wd-reveal .wd-rev-sub .wd-src-word{font-size:18px;font-weight:700;opacity:.88}
.wd-speak-sm{width:28px;height:28px;border-radius:9px}
.wd-rev-sub-ipa{font-family:ui-monospace,Menlo,monospace;font-size:12px;color:var(--ht);font-weight:600;text-align:center;letter-spacing:.2px;opacity:.78;margin-top:2px}
.wd-blank{display:inline-block;font-style:normal;letter-spacing:.5px;color:var(--ht);font-weight:700;background:color-mix(in srgb,var(--tx) 6%,transparent);padding:0 6px;border-radius:6px;margin:0 1px}
.wd-hl{color:var(--pr);font-weight:700;font-style:normal;background:color-mix(in srgb,var(--pr) 14%,transparent);padding:0 4px;border-radius:5px}

/* Stats overlay member rows — tappable */
.wd-stats-row{cursor:pointer;transition:transform .12s,background .15s}
.wd-stats-row:active{transform:scale(.985)}

/* ─── Words manager (Settings → Words) ───────────────────────────── */
.wm-row{display:flex;align-items:center;gap:12px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;transition:transform .12s,background .15s,border-color .15s}
.wm-row:active{transform:scale(.985);background:color-mix(in srgb,var(--pr) 6%,var(--cd))}
.wm-thumb{width:44px;height:44px;border-radius:11px;object-fit:cover;flex-shrink:0;background:color-mix(in srgb,var(--pr) 8%,transparent)}
.wm-pair{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.wm-en{font-size:14px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wm-ru{font-size:12px;color:var(--ht);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* ─── Plants page ────────────────────────────── */
.pl-wrap{padding:0 0 40px}
/* Avatar carousel */
.pl-avatars{display:flex;gap:14px;overflow-x:auto;padding:8px 4px 18px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.pl-avatars::-webkit-scrollbar{display:none}
.pl-av{background:none;border:none;padding:0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;scroll-snap-align:start;min-width:64px;transition:transform .15s}
.pl-av:active{transform:scale(.92)}
.pl-av-pic{width:60px;height:60px;border-radius:50%;overflow:hidden;background:color-mix(in srgb,var(--pr) 14%,var(--cd));border:2px solid transparent;display:flex;align-items:center;justify-content:center;position:relative;transition:border-color .2s,box-shadow .2s}
.pl-av.s .pl-av-pic{border-color:var(--pr);box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 22%,transparent)}
.pl-av-pic img{width:100%;height:100%;object-fit:cover}
.pl-av-ph{font-size:28px;line-height:1}
.pl-av-plus{background:color-mix(in srgb,var(--pr) 18%,var(--cd));color:var(--pr);border:1.5px dashed color-mix(in srgb,var(--pr) 55%,transparent)}
.pl-av-dot{position:absolute;bottom:0;right:0;width:14px;height:14px;border-radius:50%;border:2px solid var(--bg);box-shadow:0 0 6px color-mix(in srgb,currentColor 40%,transparent)}
.pl-av-l{font-size:11px;font-weight:600;color:var(--tx);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.1px}
.pl-av.s .pl-av-l{color:var(--pr)}

/* Main card */
.pl-card{position:relative;border-radius:22px;overflow:hidden;background:var(--cd);min-height:460px;box-shadow:var(--shadow-1);animation:ci .3s ease-out;touch-action:pan-y}
.pl-card-bg{position:absolute;inset:0;background-size:cover;background-position:center;filter:saturate(1.05)}
.pl-card-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25) 0%,rgba(0,0,0,0) 35%,rgba(0,0,0,0) 55%,rgba(0,0,0,.55) 100%)}
.pl-card-noimg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:130px;opacity:.45;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 30%,transparent),color-mix(in srgb,var(--ok) 18%,transparent))}
.pl-card-over{position:relative;z-index:1;display:flex;flex-direction:column;height:100%;min-height:460px;padding:18px 18px 16px;color:#fff;text-shadow:0 1px 6px rgba(0,0,0,.55)}
.pl-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pl-card-titles{flex:1;min-width:0}
.pl-card-name{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;letter-spacing:-.3px}
.pl-card-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-card-sub{font-size:13px;font-style:italic;opacity:.85;margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-stage{display:inline-flex;align-items:center;gap:3px;margin-left:8px;padding:2px 8px;border-radius:10px;background:rgba(255,255,255,.18);font-size:11px;font-style:normal;font-weight:700;vertical-align:middle;backdrop-filter:blur(4px)}
.pl-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;color:#fff;text-shadow:none;letter-spacing:.3px;flex-shrink:0}
.pl-pill-dot{width:6px;height:6px;border-radius:50%;background:#fff}

/* Speech bubble */
.pl-bubble{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:color-mix(in srgb,#000 36%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:13px;font-weight:500;line-height:1.35;border:1px solid rgba(255,255,255,.16)}
.pl-bubble-icon{font-size:22px;flex-shrink:0;filter:drop-shadow(0 1px 3px rgba(0,0,0,.4))}

/* Actions */
.pl-actions{display:flex;gap:8px;margin-top:12px}
.pl-btn{flex:1;border:none;border-radius:14px;padding:13px 14px;font-size:14px;font-weight:700;cursor:pointer;transition:transform .12s,background .15s;text-shadow:none;display:flex;align-items:center;justify-content:center;gap:6px}
.pl-btn:active{transform:scale(.96)}
.pl-btn-primary{background:color-mix(in srgb,var(--ok) 88%,#fff);color:#fff;box-shadow:0 4px 14px color-mix(in srgb,var(--ok) 35%,transparent)}
/* Watered-today state: muted grey, no glow. Tap to undo. */
.pl-btn-thanks{background:color-mix(in srgb,#000 28%,rgba(255,255,255,.65));color:#fff;box-shadow:none;border:1px solid rgba(255,255,255,.22);font-weight:600;opacity:.92}
.pl-btn-thanks:active{transform:scale(.96);opacity:1}
.pl-btn-secondary{background:rgba(255,255,255,.85);color:#1a1a1a;flex:.85}
.pl-btn-more{background:rgba(255,255,255,.85);color:#1a1a1a;flex:0 0 50px;font-size:18px;font-weight:900}

/* Summary card */
.pl-sum{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-top:14px}
.pl-sum-h{font-size:11px;font-weight:700;color:var(--ht);letter-spacing:.6px;text-transform:uppercase;margin-bottom:10px}
.pl-sum-row{font-size:13px;font-weight:600;color:var(--tx);padding:4px 0}

/* Add modal photo picker */
.pl-photo-pick{display:block;width:100%;aspect-ratio:1;border-radius:18px;border:2px dashed color-mix(in srgb,var(--pr) 50%,transparent);background:color-mix(in srgb,var(--pr) 6%,var(--cd));background-size:cover;background-position:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;transition:border-color .2s,background-color .15s;position:relative;overflow:hidden}
.pl-photo-pick:active{transform:scale(.99)}
.pl-photo-pick.pl-photo-set{border-style:solid;border-color:var(--pr)}
.pl-photo-pick.pl-photo-set::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(0,0,0,.35),rgba(0,0,0,0) 50%)}
.pl-photo-icon{font-size:42px;transition:opacity .2s;position:relative;z-index:1}
.pl-photo-l{font-size:13px;font-weight:600;color:var(--ht);position:relative;z-index:1;text-align:center;padding:0 20px}
.pl-photo-pick.pl-photo-set .pl-photo-l{color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6)}

/* Home widget — horizontal plant carousel */
.hpw{margin:0 -4px 14px;cursor:pointer}
.hpw-sub{font-size:11px;color:var(--ht);font-weight:600;margin-left:8px;letter-spacing:.1px}
.hpw-track{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 8px;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory}
.hpw-track::-webkit-scrollbar{display:none}
.hpw-item{flex-shrink:0;width:88px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;scroll-snap-align:start;transition:transform .12s,background .15s}
.hpw-item:active{transform:scale(.96);background:color-mix(in srgb,var(--pr) 6%,var(--cd))}
.hpw-av{width:54px;height:54px;border-radius:50%;overflow:hidden;background:color-mix(in srgb,var(--pr) 12%,var(--bg));display:flex;align-items:center;justify-content:center;position:relative}
.hpw-av img{width:100%;height:100%;object-fit:cover}
.hpw-ph{font-size:26px}
.hpw-dot{position:absolute;bottom:0;right:0;width:12px;height:12px;border-radius:50%;border:2px solid var(--cd)}
.hpw-name{font-size:11px;font-weight:700;color:var(--tx);max-width:80px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Plants ghost (empty Home section) — dashed circles matching the live plant avatars. */
.hpw-item-ghost{background:transparent;border:1.5px dashed var(--bd)}
.hpw-av-add{background:color-mix(in srgb,var(--pr) 12%,var(--bg));border:1.5px dashed color-mix(in srgb,var(--pr) 55%,transparent);color:var(--pr)}
.hpw-av-ghost{background:transparent;border:1.5px dashed var(--bd)}
.hpw-name-ghost{color:var(--ht);opacity:.55;letter-spacing:2px}
.hpw-status{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.3px}

/* Advice modal */
.pl-adv-head{text-align:center;margin-bottom:14px}
.pl-adv-name{font-size:18px;font-weight:800;color:var(--tx)}
.pl-adv-sub{font-size:13px;font-style:italic;color:var(--ht)}
.pl-adv-meta{display:flex;gap:10px;margin-bottom:8px}
.pl-adv-cell{flex:1;background:color-mix(in srgb,var(--pr) 8%,var(--cd));border:1px solid var(--bd);border-radius:12px;padding:10px 12px;text-align:center}
.pl-adv-cell-l{font-size:10px;font-weight:700;color:var(--ht);letter-spacing:.5px;text-transform:uppercase}
.pl-adv-cell-v{font-size:15px;font-weight:700;color:var(--tx);margin-top:4px}
.pl-tip{font-size:13px;line-height:1.45;color:var(--tx);padding:6px 0;border-bottom:1px solid color-mix(in srgb,var(--bd) 60%,transparent)}
.pl-tip:last-child{border-bottom:none}
/* Inline tips section under the main card (replaces the Tips modal in v8.27) */
.pl-inline{background:var(--cd);border:1px solid var(--bd);border-radius:18px;padding:16px 16px 14px;margin-top:14px;animation:ci .3s ease-out}
.pl-inline-h{font-size:14px;font-weight:700;color:var(--tx);text-align:center;margin-bottom:12px;letter-spacing:.1px}
.pl-inline-h strong{color:var(--pr)}

/* Candidate picker (AI uncertain → choose one) */
.pl-cand{display:flex;align-items:center;gap:12px;width:100%;background:var(--cd);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;text-align:left;transition:transform .12s,background .15s,border-color .15s}
.pl-cand:active{transform:scale(.985);background:color-mix(in srgb,var(--pr) 7%,var(--cd));border-color:color-mix(in srgb,var(--pr) 35%,transparent)}
.pl-cand-i{font-size:26px;flex-shrink:0;width:42px;height:42px;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb,var(--pr) 10%,var(--bg));border-radius:11px}
.pl-cand-bd{flex:1;min-width:0}
.pl-cand-n{font-size:14px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-cand-s{font-size:11px;font-style:italic;color:var(--ht);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-cand-c{font-size:11px;font-weight:700;color:var(--pr);background:color-mix(in srgb,var(--pr) 12%,transparent);padding:4px 8px;border-radius:8px;flex-shrink:0}

/* History graph in Advice modal */
.pl-hist-host{min-height:64px}
.pl-hist-bars{display:flex;gap:2px;height:42px;align-items:flex-end;padding:6px 4px 4px;background:color-mix(in srgb,var(--bg) 60%,var(--cd));border-radius:10px;border:1px solid var(--bd)}
.pl-hist-bar{flex:1;min-width:2px;height:6px;background:color-mix(in srgb,var(--tx) 12%,transparent);border-radius:2px;transition:background .2s}
.pl-hist-bar.on{height:36px;background:linear-gradient(180deg,color-mix(in srgb,var(--ok) 90%,#fff),var(--ok));box-shadow:0 1px 4px color-mix(in srgb,var(--ok) 40%,transparent)}
.pl-hist-stats{font-size:11px;font-weight:600;color:var(--ht);text-align:center;margin-top:8px;letter-spacing:.2px}

/* Growth timeline (v8.31.1) — horizontal scroll of dated photos under the main plant card */
.pl-ph-strip{display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;padding:8px 2px 10px;margin:0 -4px;scroll-snap-type:x proximity;scrollbar-width:none}
.pl-ph-strip::-webkit-scrollbar{display:none}
/* v8.49.5: Update button pinned, photos scroll horizontally next to it. */
.pl-ph-row{display:flex;gap:8px;padding:8px 2px 10px;margin:0 -4px;align-items:stretch}
.pl-ph-row .pl-ph-add{flex-shrink:0}
.pl-ph-scroll{flex:1;min-width:0;display:flex;gap:8px;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}
.pl-ph-scroll::-webkit-scrollbar{display:none}
.pl-ph-scroll .pl-ph-thumb{scroll-snap-align:start}
/* Inline AI health tip inside _plPhotoView — separator + soft inset card. */
.pl-pview-tip{margin:14px -2px 0;padding:14px;background:color-mix(in srgb,var(--pr) 5%,var(--cd));border:1px solid var(--bd);border-radius:14px}
.pl-pview-tip .pl-h-pill{margin-bottom:8px}
.pl-ph-add,.pl-ph-thumb{flex-shrink:0;width:78px;height:78px;border-radius:14px;border:1px solid var(--bd);background:var(--cd);position:relative;overflow:hidden;cursor:pointer;padding:0;scroll-snap-align:start;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ht);transition:transform .12s,border-color .15s,background .15s}
.pl-ph-add{border-style:dashed;border-color:color-mix(in srgb,var(--pr) 45%,var(--bd));color:var(--pr);background:color-mix(in srgb,var(--pr) 6%,var(--cd))}
.pl-ph-add:active{transform:scale(.96);background:color-mix(in srgb,var(--pr) 12%,var(--cd))}
.pl-ph-thumb{align-items:stretch;justify-content:flex-end}
.pl-ph-thumb:active{transform:scale(.96)}
.pl-ph-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pl-ph-date{position:relative;z-index:1;background:linear-gradient(180deg,transparent,rgba(0,0,0,.78));color:#fff;font-size:10px;font-weight:700;letter-spacing:.3px;padding:14px 6px 5px;text-align:center;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.pl-ph-empty{flex:1;display:flex;align-items:center;font-size:11px;color:var(--ht);padding:0 12px;font-style:italic}
.pl-pview{width:100%;max-height:70vh;border-radius:14px;overflow:hidden;background:var(--bg);display:flex;align-items:center;justify-content:center}

/* Bottom-nav picker (v8.47.0) — grid of toggle tiles with selection-order numbers. */
.np-hint{font-size:12px;color:var(--ht);line-height:1.4;margin-bottom:14px;text-align:center}
.np-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.np-tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;background:var(--cd);border:1.5px solid var(--bd);border-radius:14px;cursor:pointer;font-family:inherit;color:var(--ht);transition:transform .12s,border-color .15s,background .15s;-webkit-tap-highlight-color:transparent}
.np-tile:active{transform:scale(.96)}
.np-tile.np-on{background:color-mix(in srgb,var(--pr) 12%,var(--cd));border-color:color-mix(in srgb,var(--pr) 55%,var(--bd));color:var(--pr)}
.np-tile.np-disabled{opacity:.4;cursor:not-allowed}
.np-ico{display:flex;align-items:center;justify-content:center;width:36px;height:36px}
.np-l{font-size:11px;font-weight:600;letter-spacing:.2px;text-align:center}
.np-num{position:absolute;top:6px;right:6px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;background:var(--pr);color:var(--gtx);font-size:11px;font-weight:800;border-radius:999px;line-height:1}
.np-foot{display:flex;align-items:center;gap:10px}
.np-cnt{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--ht);min-width:42px}
.np-foot .btn{flex:1}

/* Plant health-check modal (v8.46.0) — status pill, summary, issues list, advice list. */
.pl-h-pill{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:999px;font-weight:700;font-size:13px;margin-bottom:10px;letter-spacing:.2px}
.pl-h-summary{font-size:14px;line-height:1.4;color:var(--tx);background:color-mix(in srgb,var(--sf) 60%,transparent);padding:10px 12px;border-radius:10px;margin-bottom:6px}
.pl-h-row{font-size:13px;line-height:1.4;color:var(--tx);padding:8px 10px;background:color-mix(in srgb,var(--ac) 8%,transparent);border-left:3px solid color-mix(in srgb,var(--ac) 50%,transparent);border-radius:0 8px 8px 0;margin-bottom:5px}
.pl-h-row-ok{background:color-mix(in srgb,var(--pr) 8%,transparent);border-left-color:color-mix(in srgb,var(--pr) 50%,transparent)}

/* ─── Workout set entry (v8.35.0 polish): big tap-friendly steppers ─── */
/* Two-row grid: [Reps row] [Weight row] [Add Set button]. Each row has a label, − number +, unit. */
.wx-stp-wrap{display:flex;flex-direction:column;gap:8px;background:color-mix(in srgb,var(--pr) 5%,var(--cd));border:1px solid color-mix(in srgb,var(--pr) 18%,var(--bd));border-radius:14px;padding:10px;margin-top:8px}
.wx-stp-row{display:flex;align-items:center;gap:8px}
.wx-stp-lbl{font-size:11px;font-weight:700;color:var(--ht);text-transform:uppercase;letter-spacing:.4px;width:48px;flex-shrink:0}
.wx-stp{flex:1;display:flex;align-items:center;background:var(--bg);border:1px solid var(--bd);border-radius:12px;overflow:hidden;height:44px}
.wx-stp-b{flex:0 0 44px;height:44px;border:none;background:transparent;color:var(--pr);font-size:22px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;user-select:none;transition:background .12s}
.wx-stp-b:active{background:color-mix(in srgb,var(--pr) 14%,transparent);transform:scale(.92)}
.wx-stp-v{flex:1;border:none;background:transparent;color:var(--tx);font-size:18px;font-weight:700;text-align:center;padding:0;font-family:inherit;outline:none;min-width:0}
.wx-stp-v::-webkit-outer-spin-button,.wx-stp-v::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.wx-stp-v[type=number]{-moz-appearance:textfield}
.wx-stp-unit{flex:0 0 30px;font-size:12px;font-weight:600;color:var(--ht);text-align:center}
.wx-stp-add{width:100%;background:var(--pr);color:#fff;border:none;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;-webkit-tap-highlight-color:transparent;transition:transform .12s,filter .15s}
.wx-stp-add:active{transform:scale(.97);filter:brightness(.92)}
.wx-stp-add::before{content:"+";font-size:22px;line-height:1;font-weight:700}
.wx-last-hint{font-size:11px;color:var(--ht);text-align:center;margin-bottom:4px;font-weight:500}
/* Better rest banner — bigger text, centered timer */
#rest-banner{font-size:16px !important}
.pl-pview img{max-width:100%;max-height:70vh;object-fit:contain;display:block}

/* Word editor */
.we-img-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:18px}
.we-img{width:140px;height:140px;border-radius:18px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 32%,transparent),color-mix(in srgb,var(--pr) 10%,transparent));border:1px solid color-mix(in srgb,var(--pr) 38%,transparent);display:flex;align-items:center;justify-content:center;position:relative}
.we-img img{width:100%;height:100%;object-fit:cover}
.we-img-ph{font-size:60px}
.we-img-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.we-img-actions .btn{padding:8px 14px;font-size:13px}
.we-actions{display:flex;gap:8px;margin-top:18px}
.we-actions .btn{flex:1}

/* Member detail page — Learned/Mistakes lists */
.wd-detail-row{padding:12px 14px;border-radius:14px;background:var(--cd);border:1px solid var(--bd);margin-bottom:8px;box-shadow:var(--shadow-1)}
.wd-detail-words{font-size:15px;line-height:1.3}
.wd-detail-tgt{font-weight:700;color:var(--tx);letter-spacing:-.2px}
.wd-detail-sep{color:var(--ht);margin:0 4px}
.wd-detail-src{color:var(--ht);font-weight:500}
.wd-detail-ipa{font-family:ui-monospace,Menlo,monospace;font-size:11px;color:var(--ht);margin-top:3px;letter-spacing:.2px}
.wd-detail-stat{font-size:11px;color:var(--ht);font-weight:600;margin-top:5px}

/* Onboarding */
.onb{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:72vh;text-align:center;padding:30px 20px}
.onb-ico{width:96px;height:96px;border-radius:28px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 40%,transparent),color-mix(in srgb,var(--pr) 8%,transparent));border:1.5px solid color-mix(in srgb,var(--pr) 50%,transparent);color:var(--pr);box-shadow:inset 0 1px 0 color-mix(in srgb,var(--pr) 22%,transparent),0 8px 28px color-mix(in srgb,var(--pr) 24%,transparent);margin-bottom:20px}
.onb-e{font-size:72px;margin-bottom:16px}/* legacy */
.onb-t{font-size:26px;font-weight:800;margin-bottom:10px;letter-spacing:-.4px;line-height:1.15}
.onb-s{font-size:14px;color:var(--ht);margin-bottom:28px;max-width:300px;line-height:1.5}
.onb-b{width:100%;max-width:300px;padding:15px 18px;border-radius:16px;border:1px solid transparent;font-size:15px;font-weight:700;cursor:pointer;margin-bottom:6px;font-family:inherit;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s,box-shadow .25s;letter-spacing:.1px}
.onb-b:active{transform:scale(.98)}
.onb-b.p{background:var(--gd);color:var(--gtx,#fff);box-shadow:0 6px 22px color-mix(in srgb,var(--pr) 32%,transparent)}
.onb-b.s2{background:linear-gradient(135deg,color-mix(in srgb,var(--pr) 16%,transparent),color-mix(in srgb,var(--pr) 4%,transparent));color:var(--pr);border-color:color-mix(in srgb,var(--pr) 40%,transparent)}
.cd2{background:var(--cd);border:2px dashed var(--pr);border-radius:16px;padding:20px;margin:16px 0;text-align:center}
.ct2{font-size:32px;font-weight:800;letter-spacing:6px;color:var(--pr)}.cl2{font-size:12px;color:var(--ht);margin-top:8px}
.ci2{width:200px;padding:16px;border-radius:14px;border:2px solid var(--bd);background:var(--cd);color:var(--tx);font-size:24px;font-weight:700;text-align:center;letter-spacing:4px;outline:none;font-family:inherit;text-transform:uppercase}

/* Events timeline view — chronological with viewport-vignette fade + highlighted current/next.
   Explicit height makes ONLY the events list scroll; the "+ Add Event" button + segmented tabs stay fixed above. */
.evts-scroll{position:relative;height:calc(100vh - 360px);height:calc(100dvh - 360px);min-height:220px;overflow-y:auto;overscroll-behavior:contain;padding:18px 4px 26px;-webkit-mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 88%,transparent 100%);mask-image:linear-gradient(to bottom,transparent 0%,#000 12%,#000 88%,transparent 100%)}
.evts-timeline{position:relative;padding-left:22px;border-left:2px solid var(--bd);margin-left:10px}
.evt-row{position:relative;margin:0 0 12px 10px}
/* Countdown pill — appears in event title row, color-coded by urgency */
.evt-tt-row{display:flex;align-items:center;gap:8px}
.evt-cd{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;letter-spacing:.2px;white-space:nowrap;flex-shrink:0;text-transform:uppercase}
.evt-cd-now{background:color-mix(in srgb,var(--ac) 18%,transparent);color:var(--ac);box-shadow:0 0 8px color-mix(in srgb,var(--ac) 22%,transparent)}
.evt-cd-soon{background:color-mix(in srgb,var(--wn) 18%,transparent);color:var(--wn)}
.evt-cd-far{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.evt-cd-fafar{background:color-mix(in srgb,var(--ht) 18%,transparent);color:var(--ht)}
.evt-cd-past{background:color-mix(in srgb,var(--ht) 12%,transparent);color:var(--ht);opacity:.7;font-weight:600;text-transform:none}
.evt-dot{position:absolute;left:-39px;top:16px;width:14px;height:14px;border-radius:50%;border:2.5px solid var(--bg);transition:box-shadow .25s,transform .25s}
.evt-card{margin-bottom:0!important;transition:transform .25s,border-color .25s,background .25s,box-shadow .25s}
.evt-row.evt-high .evt-card{border:2px solid var(--pr);background:color-mix(in srgb,var(--pr) 12%,var(--cd))!important;transform:scale(1.015);box-shadow:0 6px 22px color-mix(in srgb,var(--pr) 24%,transparent),0 2px 6px rgba(0,0,0,.12)}
.evt-row.evt-high .evt-dot{background:var(--pr)!important;transform:scale(1.15);box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 28%,transparent)}

/* Avatar */
.av{width:32px;height:32px;border-radius:50%;object-fit:cover;flex-shrink:0}
.av-em{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

/* Quantity badge */
.qty{display:inline-flex;padding:2px 8px;border-radius:6px;font-size:11px;font-weight:700;background:color-mix(in srgb,var(--wn),transparent 85%);color:var(--wn)}

/* Theme grid */
.tg{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:24px}
.tc{border-radius:14px;padding:14px 10px;cursor:pointer;text-align:center}.te{font-size:24px;margin-bottom:4px;display:inline-flex;align-items:center;justify-content:center;line-height:1}.tn{font-size:12px;font-weight:600}
.td{display:flex;gap:3px;justify-content:center;margin-top:8px}.tdd{width:12px;height:12px;border-radius:50%}

/* Custom theme editor */
.ct-prev{padding:16px;border-radius:18px;border:1px solid var(--bd);margin-bottom:14px;transition:background .2s,color .2s}
.ct-prev-h{font-size:18px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
.ct-prev-s{font-size:12px;margin-top:3px;font-weight:500}
.ct-prev-card{margin-top:14px;border-radius:14px;padding:12px}
.ct-prev-row{display:flex;align-items:center;gap:10px}
.ct-prev-ico{width:34px;height:34px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0}
.ct-prev-tt{flex:1;font-size:14px;font-weight:600}
.ct-prev-pill{padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700}
.ct-prev-chips{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.ct-prev-chip{padding:5px 11px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.1px}
.ct-prev-btn{width:100%;padding:11px;border-radius:14px;border:none;font-size:14px;font-weight:700;margin-top:12px;cursor:default;font-family:inherit}
.ct-warn{background:color-mix(in srgb,var(--wn) 14%,transparent);border:1px solid color-mix(in srgb,var(--wn) 40%,transparent);border-radius:12px;padding:8px 12px;margin-bottom:4px}
.ct-warn-row{font-size:11px;font-weight:600;color:var(--wn);line-height:1.5}
.ct-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;gap:12px}
.ct-row+.ct-row{border-top:1px solid var(--bd)}
.ct-row-lb{font-size:14px;font-weight:600;color:var(--tx)}
.ct-row-val{display:inline-flex;align-items:center;gap:10px}
.ct-row-val input[type="color"]{width:42px;height:42px;border-radius:11px;border:1.5px solid var(--bd);background:transparent;cursor:pointer;padding:2px;-webkit-appearance:none}
.ct-row-val input[type="color"]::-webkit-color-swatch{border:none;border-radius:8px}
.ct-row-val input[type="color"]::-moz-color-swatch{border:none;border-radius:8px}
.ct-row-hex{font-family:ui-monospace,Menlo,monospace;font-size:12px;font-weight:600;color:var(--ht);min-width:74px;text-align:right}

/* Reminders list */
.ri{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:12px;color:var(--ht);margin-bottom:4px}
.ri input{flex:1;padding:6px 10px;border-radius:8px;border:1px solid var(--bd);background:var(--cd);color:var(--tx);font-size:12px;outline:none;font-family:inherit}

/* Empty state */
.emp{text-align:center;padding:48px 20px;color:var(--ht)}.emp-i{font-size:48px;margin-bottom:14px;opacity:.8}.emp-t{font-size:16px;font-weight:600;margin-bottom:6px;color:var(--tx)}
.emp-cta{cursor:pointer;border:1.5px dashed var(--bd);border-radius:var(--r);margin:6px 2px;-webkit-tap-highlight-color:transparent;transition:transform .15s ease,border-color .18s ease,background .18s ease}
.emp-cta:hover{border-color:var(--pr);background:var(--pg)}
.emp-cta:active{transform:scale(.985)}
.emp-cta .emp-add{display:inline-flex;align-items:center;gap:6px;margin-top:16px;font-weight:700;font-size:13px;color:var(--pr);background:var(--pg);padding:9px 18px;border-radius:var(--r-pill)}
.emp-cta .emp-add b{font-size:16px;line-height:1;font-weight:700}
.ghost-card{display:flex;align-items:center;gap:14px;border:1.5px dashed var(--bd);border-radius:var(--r);padding:16px;margin:0 2px 12px;cursor:pointer;-webkit-tap-highlight-color:transparent;opacity:.92;transition:border-color .18s ease,background .18s ease,transform .15s ease,opacity .18s ease}
.ghost-card:hover{border-color:var(--pr);background:var(--pg);opacity:1}
.ghost-card:active{transform:scale(.99)}
.ghost-ic{width:42px;height:42px;border-radius:12px;background:var(--pg);display:grid;place-items:center;font-size:22px;flex:none}
.ghost-tx{flex:1;min-width:0}.ghost-tt{font-weight:700;font-size:15px;color:var(--tx)}.ghost-sb{font-size:12.5px;color:var(--ht);margin-top:2px}
.ghost-add{color:var(--pr);font-weight:800;font-size:22px;line-height:1;flex:none;padding-right:4px}

/* Debug panel */
.dbg{position:fixed;bottom:calc(var(--nh) + env(safe-area-inset-bottom, 0px));left:0;right:0;background:#1a0000;border-top:2px solid var(--ac);max-height:150px;overflow-y:auto;padding:8px 12px;font-size:11px;color:var(--ac);font-family:monospace;z-index:30;white-space:pre-wrap}
.dbg-cp{position:absolute;top:4px;right:8px;background:var(--ac);color:#fff;border:none;padding:3px 8px;border-radius:6px;font-size:10px;cursor:pointer}

/* Toast */
.toast{position:fixed;bottom:calc(var(--nh) + env(safe-area-inset-bottom, 0px) + 12px);left:50%;transform:translateX(-50%) translateY(80px);background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:16px;padding:12px 20px;font-size:14px;font-weight:600;z-index:40;display:flex;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.4);opacity:0;transition:all .3s cubic-bezier(.2,.9,.3,1);pointer-events:none;max-width:calc(100vw - 40px);white-space:nowrap;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto}
.toast-u{background:var(--pr);color:#fff;border:none;border-radius:8px;padding:6px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;flex-shrink:0}

/* Hamburger menu */
.menu-ov{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:45;opacity:0;pointer-events:none;transition:opacity .25s}
.menu-ov.open{opacity:1;pointer-events:auto}
/* ── Coachmark tour (tour.js) ───────────────────────────────── */
#tour-root{position:fixed;inset:0;z-index:100000;pointer-events:none;font-family:inherit}
#tour-catch{position:absolute;inset:0;pointer-events:auto;background:transparent}
#tour-hole{position:absolute;border-radius:16px;box-sizing:border-box;pointer-events:none;outline:2px solid color-mix(in srgb,var(--pr) 85%,#fff);outline-offset:2px;box-shadow:0 0 0 9999px rgba(7,6,12,.66);transition:top .32s cubic-bezier(.4,0,.2,1),left .32s cubic-bezier(.4,0,.2,1),width .32s cubic-bezier(.4,0,.2,1),height .32s cubic-bezier(.4,0,.2,1)}
#tour-hole::after{content:'';position:absolute;inset:-2px;border-radius:inherit;box-shadow:0 0 0 4px color-mix(in srgb,var(--pr) 26%,transparent),0 0 24px 5px color-mix(in srgb,var(--pr) 42%,transparent);animation:tourPulse 2s ease-in-out infinite}
@keyframes tourPulse{0%,100%{opacity:.5}50%{opacity:1}}
#tour-arrow{position:absolute;color:var(--pr);pointer-events:none;filter:drop-shadow(0 3px 6px color-mix(in srgb,var(--pr) 45%,transparent));animation:tourBob 1.5s ease-in-out infinite}
#tour-arrow svg{display:block;width:38px;height:48px}
#tour-arrow.down{transform:scaleY(-1);animation:tourBobDown 1.5s ease-in-out infinite}
@keyframes tourBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes tourBobDown{0%,100%{transform:scaleY(-1) translateY(0)}50%{transform:scaleY(-1) translateY(-7px)}}
#tour-card{position:absolute;width:300px;max-width:calc(100vw - 28px);background:var(--sf);color:var(--tx);border:1px solid var(--bd);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.42);padding:18px 18px 14px;pointer-events:auto;transition:top .32s cubic-bezier(.4,0,.2,1),left .32s cubic-bezier(.4,0,.2,1)}
.tour-ic{width:42px;height:42px;border-radius:13px;background:var(--pg);display:grid;place-items:center;font-size:23px;margin-bottom:11px}
.tour-t{font-size:17px;font-weight:800;letter-spacing:-.3px;margin-bottom:5px;color:var(--tx)}
.tour-b{font-size:13.5px;line-height:1.5;color:var(--ht)}
.tour-ft{display:flex;align-items:center;gap:6px;margin-top:16px}
.tour-dots{display:flex;gap:5px;flex:1;align-items:center}
.tour-dot{width:6px;height:6px;border-radius:50%;background:var(--bd);transition:width .2s,background .2s}
.tour-dot.a{background:var(--pr);width:18px;border-radius:3px}
.tour-bk{background:transparent;border:none;color:var(--ht);font-size:13px;font-weight:600;cursor:pointer;padding:8px 10px;font-family:inherit}
.tour-nx{background:var(--gd);color:var(--gtx,#fff);border:none;border-radius:12px;padding:9px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:transform .15s}
.tour-nx:active{transform:scale(.96)}
.tour-skip{position:absolute;top:11px;right:13px;background:transparent;border:none;color:var(--ht);font-size:12px;font-weight:600;cursor:pointer;opacity:.7;font-family:inherit;padding:4px 6px}
@media (prefers-reduced-motion:reduce){#tour-hole,#tour-card{transition:none}#tour-arrow,#tour-hole::after{animation:none}}
.menu-p{position:absolute;top:0;right:0;width:260px;height:100%;background:var(--sf);transform:translateX(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1);padding:20px;padding-top:60px;box-shadow:-8px 0 32px rgba(0,0,0,.3)}
.menu-ov.open .menu-p{transform:translateX(0)}
.menu-h{font-size:17px;font-weight:700;margin-bottom:16px;color:var(--ht)}
.menu-i{display:flex;align-items:center;gap:12px;width:100%;padding:13px 12px;border:none;background:none;color:var(--tx);font-size:15px;font-weight:500;cursor:pointer;border-radius:12px;font-family:inherit;text-align:left;transition:background .15s}
.menu-i:active{background:var(--cd)}
.menu-i .mi-ico{font-size:20px;width:28px;text-align:center;flex-shrink:0}
.menu-i .mi-l{flex:1}
.menu-i .mi-cnt{min-width:22px;height:22px;padding:0 7px;border-radius:11px;background:var(--ac);color:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;justify-content:center}
/* Toggle switch (iOS-style, used in digest config) */
.tgs{width:36px;height:20px;background:var(--bd);border-radius:10px;position:relative;cursor:pointer;transition:background .2s;flex-shrink:0;border:none}
.tgs.on{background:var(--ok)}
.tgs-knob{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tgs.on .tgs-knob{transform:translateX(16px)}

/* ═══ v6.6 effects pack — keep lightweight, GPU-only ═══ */

/* Skeleton loaders (shimmer via background-position) */
@keyframes shim{0%{background-position:-300px 0}100%{background-position:300px 0}}
.sk-wrap{padding:12px 0}
.sk-b{background:linear-gradient(90deg,var(--cd) 0%,color-mix(in srgb,var(--cd),white 6%) 50%,var(--cd) 100%);background-size:600px 100%;animation:shim 1.4s ease-in-out infinite;border-radius:12px;border:1px solid var(--bd)}
.sk-sub{height:14px;width:40%;border-radius:6px;margin:6px 0 14px}
.sk-w{height:82px;margin-bottom:16px}
.sk-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}
.sk-st{height:82px;border-radius:16px}
.sk-sc{height:12px;width:30%;border-radius:6px;margin:14px 0 10px}
.sk-c{height:60px;margin-bottom:10px}

/* Weather ambient backgrounds (cinematic, multi-layer; all CSS, GPU-only) */
.wbg{position:relative;overflow:hidden;border-radius:20px;padding:14px 14px;margin:0 -4px 16px;border:1px solid var(--bd);box-shadow:0 8px 28px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.06)}
.wbg>*{position:relative;z-index:3}
.wbg::before,.wbg::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:1}
.wbg::after{z-index:2}
/* Optional video background — loaded asynchronously, fades in on canplay.
   CSS gradient + particle layers remain as the offline/loading fallback.
   When video is in, particles fade out and a soft scrim is added to .wbg-vd-scrim for text legibility. */
.wbg-vd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;opacity:0;transition:opacity .8s ease;pointer-events:none;border-radius:inherit}
.wbg-vd.loaded{opacity:1}
.wbg-vd-scrim{position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,rgba(0,0,0,.12) 0%,rgba(0,0,0,.42) 100%);opacity:0;transition:opacity .8s ease;pointer-events:none;border-radius:inherit}
.wbg.has-video::before,.wbg.has-video::after{opacity:0;transition:opacity .8s ease}
.wbg.has-video .wbg-vd-scrim{opacity:1}
/* Clear / Sunny — warm dawn-to-sky gradient with sun glow */
.wbg-clear{background:radial-gradient(ellipse 140% 90% at 85% 20%,#ffd97a 0%,#f0a33a 18%,#d4783c 35%,#4a6db0 65%,#1e3a5c 100%),linear-gradient(180deg,#2d6aa0 0%,#1a3a5c 100%);background-blend-mode:soft-light,normal}
.wbg-clear::before{background:radial-gradient(circle 70px at 88% 15%,#fff4c2 0%,rgba(255,200,80,.6) 30%,rgba(255,160,60,.25) 60%,transparent 80%);animation:sunGlow 5s ease-in-out infinite}
.wbg-clear::after{background:radial-gradient(circle 110px at 88% 15%,rgba(255,230,140,.18) 0%,transparent 65%),radial-gradient(ellipse 200% 50% at 50% 100%,rgba(255,140,60,.12),transparent 60%);animation:sunRay 7s ease-in-out infinite}
@keyframes sunGlow{0%,100%{opacity:.85;transform:scale(1)}50%{opacity:1;transform:scale(1.18)}}
@keyframes sunRay{0%,100%{opacity:.4;transform:scale(1) rotate(0deg)}50%{opacity:.7;transform:scale(1.25) rotate(6deg)}}
/* Cloudy — atmospheric overcast with drifting cloud puffs and depth fog */
.wbg-cloud{background:radial-gradient(ellipse 130% 70% at 50% 0%,#5a6e85 0%,#3d4f63 40%,#2a3444 80%,#1e2530 100%),linear-gradient(180deg,#3d4f63,#212a3a)}
.wbg-cloud::before{background:radial-gradient(ellipse 140px 50px at 18% 22%,rgba(210,222,234,.32),rgba(180,195,210,.05) 60%,transparent),radial-gradient(ellipse 160px 45px at 62% 32%,rgba(190,205,220,.28),rgba(170,185,200,.03) 65%,transparent),radial-gradient(ellipse 110px 40px at 88% 58%,rgba(200,215,230,.18),transparent 70%);animation:cloudDrift 14s ease-in-out infinite}
.wbg-cloud::after{background:linear-gradient(180deg,transparent 0%,transparent 60%,rgba(20,28,40,.35) 100%)}
@keyframes cloudDrift{0%,100%{transform:translateX(0)}50%{transform:translateX(10px)}}
/* Rain — moody rain with diagonal streaks, deep blue tones, ambient glow */
.wbg-rain{background:radial-gradient(ellipse 130% 80% at 50% 0%,#3a5478 0%,#27384f 45%,#172333 100%),linear-gradient(180deg,#1c2a3a,#0e1620)}
.wbg-rain::before{background:repeating-linear-gradient(100deg,transparent 0,transparent 4px,rgba(140,190,255,.42) 4px,rgba(140,190,255,.02) 6px);background-size:20px 30px;animation:rainFall .5s linear infinite}
.wbg-rain::after{background:repeating-linear-gradient(98deg,transparent 0,transparent 8px,rgba(120,170,240,.22) 8px,rgba(120,170,240,.02) 10px);background-size:30px 40px;animation:rainFall2 .7s linear infinite;mix-blend-mode:screen}
@keyframes rainFall{from{background-position:0 -30px}to{background-position:-20px 30px}}
@keyframes rainFall2{from{background-position:0 -40px}to{background-position:-15px 40px}}
/* Snow — soft cold gradient with drifting snowflakes */
.wbg-snow{background:radial-gradient(ellipse 130% 80% at 50% 0%,#7a8ea4 0%,#516780 35%,#34465c 75%,#1f2d3e 100%),linear-gradient(180deg,#4a5a6e,#2d3a4a)}
.wbg-snow::before{background:radial-gradient(circle 2px at 10% 15%,#fff,transparent),radial-gradient(circle 1.5px at 25% 8%,#e8f0ff,transparent),radial-gradient(circle 2px at 42% 22%,#fff,transparent),radial-gradient(circle 1px at 58% 12%,#e8f0ff,transparent),radial-gradient(circle 2px at 75% 18%,#fff,transparent),radial-gradient(circle 1.5px at 90% 10%,#e8f0ff,transparent),radial-gradient(circle 1px at 18% 50%,#fff,transparent),radial-gradient(circle 2px at 35% 58%,#e8f0ff,transparent),radial-gradient(circle 1.5px at 52% 45%,#fff,transparent),radial-gradient(circle 1px at 68% 55%,#fff,transparent),radial-gradient(circle 2px at 82% 48%,#e8f0ff,transparent),radial-gradient(circle 1.5px at 15% 82%,#fff,transparent),radial-gradient(circle 1px at 48% 90%,#e8f0ff,transparent),radial-gradient(circle 2px at 70% 85%,#fff,transparent);animation:snowDrift 6s linear infinite;opacity:.9}
.wbg-snow::after{background:radial-gradient(circle 1.5px at 5% 35%,#fff,transparent),radial-gradient(circle 2px at 30% 40%,#e8f0ff,transparent),radial-gradient(circle 1px at 55% 32%,#fff,transparent),radial-gradient(circle 1.5px at 80% 38%,#e8f0ff,transparent),radial-gradient(circle 1px at 22% 70%,#fff,transparent),radial-gradient(circle 2px at 60% 75%,#e8f0ff,transparent),radial-gradient(circle 1.5px at 88% 72%,#fff,transparent);animation:snowDrift2 8s linear infinite;opacity:.6}
@keyframes snowDrift{0%{transform:translate(0,-10px)}100%{transform:translate(-6px,10px)}}
@keyframes snowDrift2{0%{transform:translate(0,-8px)}100%{transform:translate(4px,8px)}}
/* Night — deep starry sky with subtle aurora glow */
.wbg-night{background:radial-gradient(ellipse 100% 60% at 75% 20%,#1f2a5a 0%,#162244 25%,#0a1228 60%,#050911 100%),linear-gradient(180deg,#111833,#070b1a)}
.wbg-night::before{background:radial-gradient(circle 1.5px at 8% 18%,#fff,transparent),radial-gradient(circle 1px at 15% 65%,#aaccff,transparent),radial-gradient(circle 2px at 22% 10%,#fff,transparent),radial-gradient(circle 1px at 30% 42%,#ddeeff,transparent),radial-gradient(circle 1.5px at 38% 78%,#fff,transparent),radial-gradient(circle 1px at 45% 25%,#aaccff,transparent),radial-gradient(circle 2px at 52% 55%,#fff,transparent),radial-gradient(circle 1px at 60% 15%,#ddeeff,transparent),radial-gradient(circle 1.5px at 68% 72%,#fff,transparent),radial-gradient(circle 1px at 75% 35%,#aaccff,transparent),radial-gradient(circle 2px at 82% 8%,#fff,transparent),radial-gradient(circle 1px at 88% 58%,#ddeeff,transparent),radial-gradient(circle 1.5px at 92% 82%,#fff,transparent),radial-gradient(circle 1px at 35% 90%,#aaccff,transparent);animation:starTwinkle 4s ease-in-out infinite alternate}
.wbg-night::after{background:radial-gradient(circle 1px at 5% 40%,#fff,transparent),radial-gradient(circle 1.5px at 18% 85%,#ddeeff,transparent),radial-gradient(circle 1px at 42% 48%,#fff,transparent),radial-gradient(circle 1.5px at 57% 88%,#aaccff,transparent),radial-gradient(circle 1px at 72% 52%,#fff,transparent),radial-gradient(circle 1.5px at 95% 30%,#ddeeff,transparent),radial-gradient(ellipse 18px 14px at 80% 20%,rgba(230,230,180,.08),transparent);animation:starTwinkle2 5s ease-in-out infinite alternate}
@keyframes starTwinkle{0%{opacity:.4}100%{opacity:.9}}
@keyframes starTwinkle2{0%{opacity:.7}100%{opacity:.35}}
/* Storm — dark turbulent sky with rain and lightning flashes */
.wbg-storm{background:radial-gradient(ellipse 130% 70% at 50% 30%,#2a3a52 0%,#172132 50%,#0a0f1a 100%),linear-gradient(180deg,#1a2535,#0a0f1a)}
.wbg-storm::before{background:repeating-linear-gradient(102deg,transparent 0,transparent 3px,rgba(140,180,255,.25) 3px,rgba(140,180,255,.01) 5px);background-size:18px 24px;animation:rainFall .4s linear infinite}
.wbg-storm::after{background:none;animation:lightning 7s ease-in-out infinite}
@keyframes lightning{0%,89%,93%,95%,100%{background:transparent}90%{background:rgba(200,220,255,.15)}92%{background:transparent}94%{background:rgba(180,200,255,.25)}}

/* Task complete — spring scale, then slide & fade */
@keyframes tkPop{0%{transform:scale(1)}30%{transform:scale(1.035)}60%{transform:scale(.97)}100%{transform:scale(1)}}
@keyframes tkGo{0%{transform:translateX(0) scale(1);opacity:1;max-height:80px;margin-bottom:10px;padding-top:13px;padding-bottom:13px;border-width:1px}70%{transform:translateX(38px) scale(.98);opacity:.1}100%{transform:translateX(60px) scale(.95);opacity:0;max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0;border-width:0}}
.c.c-pop{animation:tkPop .28s cubic-bezier(.2,.9,.3,1.1)}
.c.c-go{animation:tkGo .42s cubic-bezier(.55,0,.3,1) forwards;overflow:hidden;pointer-events:none}
.cb.cb-k.cb-flash{box-shadow:0 0 0 6px color-mix(in srgb,var(--ok),transparent 70%);transition:box-shadow .3s}

/* Confetti burst (24 shards) */
.cf{position:fixed;width:0;height:0;pointer-events:none;z-index:60}
.cf i{position:absolute;left:-4px;top:-4px;width:7px;height:9px;border-radius:1px;animation:cFly .9s cubic-bezier(.15,.55,.3,1) forwards;will-change:transform,opacity}
@keyframes cFly{0%{transform:translate(0,0) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}

/* Count-up number wrapper (just inline-block for clean metrics) */
.cu{display:inline-block;font-variant-numeric:tabular-nums}

/* Toggle micro-interactions: spring pop ONLY on actual click (via .pop class), not on re-render */
.ob,.ch,.fi,.tab{transition:background-color .2s,color .2s,border-color .2s,box-shadow .25s;will-change:transform}
.ob.pop,.ch.pop,.fi.pop,.tab.pop{animation:chPop .34s cubic-bezier(.2,.9,.3,1.3)}
@keyframes chPop{0%{transform:scale(.92)}45%{transform:scale(1.08)}72%{transform:scale(.98)}100%{transform:scale(1)}}
.ob:active,.ch:active,.fi:active,.tab:active{transform:scale(.93);transition:transform .08s}

/* Priority colors (semantic — gray / orange / red), override .ob.s default */
:root{--pri-lo:#8a8797;--pri-md:#f08a3c;--pri-hi:#e04656}
.ob-pri-low.s{color:var(--pri-lo);background:color-mix(in srgb,var(--pri-lo),transparent 82%);border-color:color-mix(in srgb,var(--pri-lo),transparent 55%);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri-lo),transparent 88%)}
.ob-pri-normal.s{color:var(--pri-md);background:color-mix(in srgb,var(--pri-md),transparent 82%);border-color:color-mix(in srgb,var(--pri-md),transparent 55%);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri-md),transparent 88%)}
.ob-pri-high.s{color:var(--pri-hi);background:color-mix(in srgb,var(--pri-hi),transparent 80%);border-color:color-mix(in srgb,var(--pri-hi),transparent 50%);box-shadow:0 0 0 3px color-mix(in srgb,var(--pri-hi),transparent 85%)}

/* Calendar */
.cal-mo{position:fixed;inset:0;background:var(--bg);z-index:60;display:none;flex-direction:column}
.cal-mo.open{display:flex}
.cal-hd{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;padding-top:max(10px, calc(env(safe-area-inset-top, 0px) + 4px));gap:8px}
.cal-hd-t{font-size:16px;font-weight:700;letter-spacing:-.3px}
.cal-nav{display:flex;align-items:center;gap:12px;flex:1;justify-content:center}
.cal-btn{background:var(--cd);border:1px solid var(--bd);color:var(--tx);cursor:pointer;width:38px;height:38px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;transition:transform .12s,background .15s;flex-shrink:0;box-shadow:var(--shadow-1)}
.cal-btn:active{transform:scale(.92);background:var(--sf)}
.cal-btn svg{width:16px;height:16px;stroke-width:2.5}
.cal-body{flex:1;overflow-y:auto;padding:4px 8px 14px;overscroll-behavior:contain}
.cal-grid-card{background:var(--cd);border:1px solid var(--bd);border-radius:22px;padding:6px 6px 10px;box-shadow:var(--shadow-1);margin-top:6px}
.cal-dh{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:10px;font-weight:700;color:var(--ht);padding:10px 0 6px;text-transform:uppercase;letter-spacing:.8px}
.cal-wk{margin-bottom:2px;border-bottom:1px solid color-mix(in srgb,var(--bd) 60%,transparent)}.cal-wk:last-child{border-bottom:none}
.cal-days{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.cal-dy{padding:4px 0 2px;font-size:12px;font-weight:500;color:var(--ht);min-height:32px;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:6px;transition:background .15s}
.cal-dy.cur-m{color:var(--tx)}
.cal-dy.wkend{color:#e74c3c}
.cal-dy.today{color:var(--pr);font-weight:800}
.cal-dy .dn{width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}
.cal-dy.today .dn{background:var(--pr);color:#fff}
.cd-dots{display:flex;gap:2px;justify-content:center;height:4px}
.cd-dot{width:4px;height:4px;border-radius:50%;display:block}
.cal-wk-cur{background:color-mix(in srgb,var(--pr),transparent 93%);border-radius:8px}
.cal-bars{position:relative;min-height:4px;padding:0 1px}
.cal-ev{position:absolute;height:20px;border-radius:999px;font-size:9px;font-weight:700;line-height:18px;padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;cursor:pointer;transition:opacity .15s,background .15s;background:color-mix(in srgb,var(--cc,var(--pr)) 30%,var(--bg));color:var(--tx);border:1px solid color-mix(in srgb,var(--cc,var(--pr)) 65%,transparent)}
.cal-ev:active{opacity:.7}
.ev-ico{display:inline-flex;align-items:center;margin-right:3px;opacity:.95;vertical-align:middle}
.cal-ev.ev-done{text-decoration:line-through;opacity:.55}
/* 2-line wrapped variant — fits ~15 chars (2×~7) before ellipsis; used in the full month view */
.cal-ev.ev-2l{display:flex;align-items:flex-start;gap:4px;padding:4px 7px;white-space:normal;text-overflow:clip;line-height:13px;border-radius:10px}
.cal-ev.ev-2l .ev-ico{margin-right:0;flex-shrink:0;height:13px}
.cal-ev.ev-2l .ev-tx{flex:1;min-width:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-clamp:2;overflow:hidden;text-overflow:ellipsis;word-break:break-word}
@keyframes calSlideL{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}
@keyframes calSlideR{from{transform:translateX(-30px);opacity:0}to{transform:translateX(0);opacity:1}}
.cal-slide-l{animation:calSlideL .25s ease-out}
.cal-slide-r{animation:calSlideR .25s ease-out}
.cal-more{position:absolute;text-align:center;font-size:9px;font-weight:700;color:var(--ht);height:14px;line-height:14px}
.cal-dy{cursor:pointer}.cal-dy:active .dn{background:var(--sf)}
.cday-overlay{position:fixed;inset:0;background:var(--bg);z-index:65;display:flex;flex-direction:column;animation:fadeIn .15s}
.cday-panel{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.cday-hd{display:flex;align-items:center;gap:12px;padding:16px 20px;padding-top:max(16px, calc(env(safe-area-inset-top, 0px) + 6px));border-bottom:1px solid var(--bd)}
.cday-back{background:none;border:none;color:var(--tx);cursor:pointer;padding:4px}
.cday-title{font-size:17px;font-weight:700}
.cday-item{display:flex;align-items:flex-start;gap:10px;padding:14px 16px;margin:0 12px;border-radius:12px;background:var(--cd);margin-top:8px;cursor:pointer;transition:background .15s}
.cday-item:active{background:var(--sf)}
.cday-bd{flex:1;min-width:0}
.cday-tt{font-size:15px;font-weight:600;color:var(--tx);line-height:1.3}
.cday-sub{font-size:12px;color:var(--ht);margin-top:3px}
.cal-ev.ev-pr{--cc:var(--pr)}
.cal-ev.ev-ac{--cc:var(--ac)}
.cal-ev.ev-ok{--cc:var(--ok)}
.cal-ev.ev-wn{--cc:var(--wn)}
.cal-ev.ev-sub{--cc:var(--ok);border-style:dashed}
.cal-ev.ev-rec{--cc:var(--ac);border-style:dashed}
.csh-week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:10px}
.csh-day{display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 0;border-radius:8px;transition:background .15s}
.csh-day.csh-wkend{}
.csh-day.csh-today{background:color-mix(in srgb,var(--pr),transparent 85%)}
.csh-dn{font-size:9px;font-weight:600;color:var(--ht);text-transform:uppercase;letter-spacing:.3px}
.csh-num{font-size:14px;font-weight:600;color:var(--tx)}
.csh-day.csh-wkend .csh-dn,.csh-day.csh-wkend .csh-num{color:#e74c3c}
.csh-td{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--pr);color:#fff;font-weight:800}
.csh-sec{margin-top:6px}
.csh-label{font-size:11px;font-weight:700;color:var(--ht);text-transform:uppercase;letter-spacing:.3px}
.csh-item{display:flex;align-items:center;gap:9px;padding:7px 10px;margin-top:5px;border-radius:11px;background:color-mix(in srgb,var(--tx) 4%,transparent);transition:background .15s}
.csh-item:active{background:color-mix(in srgb,var(--tx) 8%,transparent)}
.csh-ico{flex-shrink:0;width:22px;height:22px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.csh-txt{font-size:12px;font-weight:600;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.csh-more{font-size:11px;color:var(--ht);text-align:center;padding:4px 0}
.csh-empty{text-align:center;font-size:12px;color:var(--ht);padding:8px 0}
.csh-sum{text-align:center;font-size:11px;font-weight:600;color:var(--ht);padding:6px 0 0;letter-spacing:.2px;border-top:1px solid var(--bd);margin-top:6px}
.cal-chips{display:flex;gap:7px;padding:8px 2px 12px;flex-wrap:wrap;justify-content:center}
.cal-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:4px 4px 12px}
.cal-chip{font-size:12px;font-weight:700;padding:8px 14px;border-radius:999px;cursor:pointer;border:1.5px solid color-mix(in srgb,var(--cc) 70%,transparent);color:var(--cc);background:color-mix(in srgb,var(--cc) 14%,var(--bg));transition:all .15s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.2px;box-shadow:0 1px 3px rgba(0,0,0,.15);min-width:96px}
.cal-chip.on{background:linear-gradient(135deg,color-mix(in srgb,var(--cc) 28%,transparent),color-mix(in srgb,var(--cc) 10%,transparent));color:var(--cc);border-color:color-mix(in srgb,var(--cc) 75%,transparent);box-shadow:0 3px 12px color-mix(in srgb,var(--cc) 22%,transparent),inset 0 1px 0 color-mix(in srgb,var(--cc) 18%,transparent)}
.cal-chip:active{transform:scale(.94)}
.cal-chip-ico{display:inline-flex;align-items:center;line-height:1}
.cal-chip-sep{width:1px;background:var(--bd);margin:0 4px;align-self:stretch}
.ced-overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .15s}
.ced-card{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:22px;max-width:320px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.35)}
.ced-type{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--ht);margin-bottom:4px}
.ced-title{font-size:17px;font-weight:700;color:var(--tx);margin-bottom:14px;line-height:1.3}
.ced-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-top:1px solid var(--bd)}
.ced-lbl{font-size:12px;color:var(--ht);font-weight:500}
.ced-val{font-size:13px;font-weight:600;color:var(--tx);display:flex;align-items:center;gap:6px}
.ced-val.pr-high{color:var(--wn)}.ced-val.pr-low{color:var(--ht)}
/* Member filter row (bottom of calendar — replaces legend) */
.cal-members{display:flex;justify-content:center;gap:10px;padding:18px 8px 8px;flex-wrap:wrap}
.cal-chip-m{font-size:12px;font-weight:600;padding:6px 14px 6px 6px;gap:8px}
.cal-chip-m img,.cal-chip-m .av,.cal-chip-m .av-em{width:24px;height:24px;border-radius:999px;box-shadow:0 0 0 2px var(--bg)}
/* Legend kept for backward compat but unused */
.cal-legend{display:none}
.cal-strip{cursor:pointer;border-radius:var(--r);background:var(--cd);border:1px solid var(--bd);padding:14px;margin-top:8px;transition:background .15s;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.cal-strip:active{background:var(--sf)}
.cal-strip .cal-days{font-size:11px}
.cal-strip .cal-dy{padding:4px 0 2px;min-height:auto}
.cal-strip .cal-bars{min-height:2px}
.cal-strip .cal-ev{height:14px;font-size:8px;line-height:14px;border-radius:3px}
.cal-strip .cal-dh{font-size:9px;padding:0 0 4px;position:static}
.hidden{display:none!important}
/* Modal scroll lock — body stops scrolling while modal open, only .mx scrolls */
body.no-scroll{overflow:hidden;touch-action:none}
body.no-scroll .mx{touch-action:pan-y}

/* ─── Profile widgets (v8.30) ──────────────────────────────── */
.prof-widget{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px 16px;margin-bottom:14px;box-shadow:var(--shadow-1);transition:transform .12s,border-color .15s}
.prof-widget:active{transform:scale(.99)}
.prof-w-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.prof-w-cell{text-align:center;padding:6px 4px;border-radius:10px;background:color-mix(in srgb,var(--bd) 18%,transparent)}
.prof-w-vl{font-size:22px;font-weight:800;line-height:1.1;letter-spacing:-.5px}
.prof-w-lb{font-size:10px;color:var(--ht);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-top:4px}
.prof-w-hd{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.prof-w-big{font-size:24px;font-weight:800;color:var(--tx);letter-spacing:-.4px;line-height:1.1}
.prof-w-sub{font-size:12px;color:var(--ht);font-weight:600;margin-top:3px}
.prof-w-flag{font-size:18px;display:flex;align-items:center;flex-shrink:0}
.prof-w-delta{font-size:12px;font-weight:700;background:color-mix(in srgb,currentColor 14%,transparent);padding:3px 9px;border-radius:9px;letter-spacing:.2px;flex-shrink:0}
.prof-w-meta{display:flex;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--ht);font-weight:600;margin-top:10px;padding-top:10px;border-top:1px solid color-mix(in srgb,var(--bd) 50%,transparent)}

/* ─── Trainings redesign (v8.29) ───────────────────────────── */
.tr-greet{padding:4px 0 14px;display:flex;justify-content:space-between;align-items:flex-end}
.tr-greet-hi{font-size:22px;font-weight:800;letter-spacing:-.4px;color:var(--tx)}
.tr-greet-sub{font-size:13px;color:var(--ht);font-weight:500;margin-top:2px}

/* Active workout banner */
.tr-active{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--ok) 22%,var(--cd)),color-mix(in srgb,var(--ok) 8%,var(--cd)));border:1px solid color-mix(in srgb,var(--ok) 45%,transparent);border-radius:14px;padding:12px 14px;margin-bottom:18px;cursor:pointer;transition:transform .12s}
.tr-active:active{transform:scale(.98)}
.tr-active-pulse{width:12px;height:12px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent);animation:trPulse 1.6s infinite}
@keyframes trPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 50%,transparent)}70%{box-shadow:0 0 0 12px color-mix(in srgb,var(--ok) 0%,transparent)}100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 0%,transparent)}}
.tr-active-bd{flex:1;min-width:0}
.tr-active-l{font-size:11px;font-weight:700;color:var(--ok);letter-spacing:.5px;text-transform:uppercase}
.tr-active-n{font-size:14px;font-weight:700;color:var(--tx);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Template hero carousel */
.tr-tpl-row{display:flex;gap:12px;overflow-x:auto;padding:4px 4px 18px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch}
.tr-tpl-row::-webkit-scrollbar{display:none}
.tr-tpl{flex-shrink:0;width:130px;height:180px;border-radius:18px;border:none;cursor:pointer;display:flex;flex-direction:column;justify-content:flex-end;padding:14px 14px;color:#fff;text-align:left;scroll-snap-align:start;position:relative;overflow:hidden;transition:transform .14s;box-shadow:var(--shadow-1);background-color:#1e293b}
.tr-tpl:active{transform:scale(.96)}
.tr-tpl-emoji{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-size:60px;line-height:1;filter:drop-shadow(0 2px 6px rgba(0,0,0,.35));opacity:.92}
