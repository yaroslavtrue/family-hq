services:
  app:
    build: .
    restart: always
    ports:
      - "8100:8000"
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - WEBAPP_URL=${WEBAPP_URL}
      - TZ=${TZ:-Europe/Belgrade}
      - DB_PATH=/data/family.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - TRELLO_API_KEY=${TRELLO_API_KEY}
      - TRELLO_TOKEN=${TRELLO_TOKEN}
      - TRELLO_BOARD_ID=${TRELLO_BOARD_ID}
      - TRELLO_FAMILY_ID=${TRELLO_FAMILY_ID:-1}
    volumes:
      - ./data:/data
      # Weather video loops — added at runtime (no rebuild needed when files appear).
      # URL /static/weather/X.mp4 resolves to /app/frontend/weather/X.mp4 (the /static/
      # URL prefix is stripped by the serve_static route). Files live at frontend/weather/ on host.
      - ./frontend/weather:/app/frontend/weather
      # Word card images — same pattern as weather. URL /static/words/<en_word>.jpg
      # resolves here. Files added manually via Telegram bot (photo + caption "Картинка: X")
      # or scp. Missing files just stay on the emoji fallback in the UI.
      - ./frontend/words:/app/frontend/words
      # Plant photos — uploaded via /api/plants from the in-app camera/file picker.
      # URL /static/plants/<id>.jpg. One image per plant.
      - ./frontend/plants:/app/frontend/plants
      # Workout template hero images — AI-generated body-part illustrations
      # uploaded per template. URL /static/workouts/<template_id>.jpg.
      - ./frontend/workouts:/app/frontend/workouts
      # Dish photos (Cooking tab, v8.48.0). One image per dish; URL /api/dishes/<id>/image.
      # Bind-mounted so deletes/uploads survive container rebuilds.
      - ./frontend/dishes:/app/frontend/dishes

  # ─── Product instance (AUTH_MODE=accounts) — email/Google sign-up ───────────
  # SAME image/code as `app`, but a SEPARATE entity: own port, own DB, own upload
  # dirs (so the two instances never share user data), and its own auth/email/Google
  # secrets. The Telegram instance above is untouched. Vars come from .env (see the
  # `product` block in .env.example). Starts only when AUTH_MODE etc. are set.
  product:
    build: .
    restart: always
    ports:
      - "8101:8000"
    environment:
      - AUTH_MODE=accounts
      - DB_PATH=/data/product.db
      - SESSION_SECRET=${PRODUCT_SESSION_SECRET}      # long random, MUST stay stable
      - BOT_TOKEN=${PRODUCT_BOT_TOKEN:-product-no-telegram}  # non-default → disables the dev auth fallback; no bot here
      - PUBLIC_BASE_URL=${PRODUCT_PUBLIC_BASE_URL}    # https://<product-domain>
      - RESEND_API_KEY=${RESEND_API_KEY}
      - MAIL_FROM=${MAIL_FROM}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - TZ=${TZ:-Europe/Belgrade}
      # Push notifications (FCM). FCM_SA_PATH points at the service-account key
      # mounted via ./data-product:/data (so the key file never enters git/env).
      # Unset → fcm.configured() is False → push is a no-op (same as the Telegram app).
      - FCM_PROJECT_ID=${FCM_PROJECT_ID:-}
      - FCM_SA_PATH=${FCM_SA_PATH:-}
    volumes:
      - ./data-product:/data
      - ./frontend/weather:/app/frontend/weather        # shared (generic loop videos, read-only content)
      - ./data-product/words:/app/frontend/words        # product users' uploads — kept separate
      - ./data-product/plants:/app/frontend/plants
      - ./data-product/workouts:/app/frontend/workouts
      - ./data-product/dishes:/app/frontend/dishes
